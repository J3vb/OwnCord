[package]
name = "owncord-parse"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Pure parsers the OwnCord desktop client runs on outside input"
publish = false

# Same policy as the app crate: production code never panics on input.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
serde_json = "1"
url = "2"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
