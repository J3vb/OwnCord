# 16 KB page alignment for the Android native library. Google Play requires it
# for new apps, and Android 15+ devices with 16 KB pages refuse to load a
# library linked for 4 KB pages.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
