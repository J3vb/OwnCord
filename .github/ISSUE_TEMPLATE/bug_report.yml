# A YAML issue form, not a Markdown template: only this format can mark a field
# required, so the environment detail a maintainer needs to reproduce a bug
# arrives with the report instead of after a round trip.
#
# Nothing in this repository validates this file's schema — prettier checks it
# parses as YAML and actionlint does not read it. A form that is valid YAML but
# an invalid issue form silently stops appearing in the chooser, so changes here
# want a look at the live "New issue" page afterwards.
name: Bug report
description: Something in the server, desktop client, or admin panel is broken.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Use
        [private security reporting](https://github.com/J3vb/OwnCord/security/advisories/new)
        instead — a public issue discloses the problem before there is a fix.

        Questions, ideas and feedback belong in
        [Discussions](https://github.com/J3vb/OwnCord/discussions), not here.

        **Never paste `config.yaml`, `.env`, or any token, key or password.**
        This repository is public, and a pasted secret is exposed to everyone
        the moment it is posted. The support bundles below leave passwords,
        tokens and keys out; attach one of those instead of copying
        configuration, after reviewing it as described below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a known starting state. A bug nobody can reproduce cannot be fixed.
      placeholder: |
        1. Start the server with …
        2. In the client, open …
        3. …
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server
        - Desktop client
        - Admin panel
        - Both server and client
        - Not sure
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: >-
        Admin panel → Updates, or the banner the server prints at startup. It is
        deliberately not exposed on the unauthenticated /health endpoint, so
        "unknown" is a fine answer if you are not the operator. A server built
        from source reports "dev".
      placeholder: "1.2.0-alpha.4 / dev / unknown"
    validations:
      required: false

  - type: input
    id: client-version
    attributes:
      label: Client version
      description: Settings → Logs shows it. Leave blank for a server-only bug.
      placeholder: "1.2.0-alpha.4"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: CPU architecture
      description: ARM64 currently applies to the Linux desktop client; there is no ARM64 server release yet.
      options:
        - x64
        - ARM64 (aarch64)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is the server deployed
      options:
        - Prebuilt binary (Windows)
        - Prebuilt binary (Linux)
        - Built from source
        - Docker / Compose
        - Linux systemd service
        - Windows service (NSSM or Task Scheduler)
        - Not applicable — client-only bug
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: tls-mode
    attributes:
      label: TLS mode
      description: The `tls.mode` setting in config.yaml.
      options:
        - self_signed
        - acme
        - manual
        - "off"
        - Not applicable / not sure
    validations:
      required: false

  - type: dropdown
    id: topology
    attributes:
      label: How do clients reach the server
      options:
        - Same machine or LAN, direct
        - Port forwarding to a public IP
        - Behind a reverse proxy
        - Tailscale
        - Not sure
    validations:
      required: false

  - type: dropdown
    id: webview
    attributes:
      label: Client webview
      description: >-
        The desktop client renders through the OS webview — WebView2 on Windows,
        WebKitGTK on Linux — so rendering and networking bugs often depend on it.
        Skip this for a server-only bug.
      options:
        - WebView2 (Windows)
        - WebKitGTK (Linux)
        - Not applicable / not sure
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Support bundle, logs, screenshots, or anything else
      description: >-
        Attach a support bundle if you can — it is usually the fastest way to a
        fix. Desktop client: Settings → Logs → Export. Server operator: admin
        panel → Diagnostics → Create support bundle preview, review it, then
        Confirm download. Both are local files that upload nothing, but review
        them before sharing: the client bundle copies log lines verbatim and
        lists your saved server names, addresses and usernames, so check or
        remove those before attaching it, or share it privately with a
        maintainer instead. You can also paste plain server console output or
        client logs. Redact tokens, invite codes and anything else you would
        not post publicly, and never paste `config.yaml` or `.env` — see the
        warning at the top.
    validations:
      required: false
