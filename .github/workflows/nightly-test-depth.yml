# B7-8: the `mutation` job below is the sharded full-client mutation baseline.
#
# Carried to main with the v2.3.0-beta.1 release, so GitHub now registers it.
# The schedule runs main's copy of this file; `gh workflow run
# nightly-test-depth.yml --ref dev` runs dev's copy. Either way every job
# checks out dev. Until a release carries the 31-shard matrix to main, the
# schedule still asks for the six old shard names, which
# Client/stryker.shard.config.mjs keeps accepting.
# Do NOT add a substitute trigger (e.g. a schedule on ci.yml): see
# nightly-docker-smoke.yml:1-15 for why a scheduled run on the default
# branch's tip would poison release gate-evidence.
name: Nightly Test Depth

on:
  schedule:
    # GitHub has started this schedule 5-6 h late every day since 2026-10-18
    # (03:30 ran at 08:12-09:12 UTC), so it is queued for the evening, off the
    # :00/:30 minutes GitHub delays most, and lands overnight.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-test-depth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    # One dev revision for every shard and for the aggregation: dev can move
    # during the up-to-90-minute matrix, and the score is only the full-surface
    # score if the shard config and the reports come from the same commit.
    name: Pin dev revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.dev.outputs.sha }}
      mutate: ${{ steps.window.outputs.mutate }}
    steps:
      - id: dev
        env:
          REPO: ${{ github.repository }}
        run: echo "sha=$(git ls-remote "https://github.com/${REPO}" refs/heads/dev | cut -f1)" >> "$GITHUB_OUTPUT"
      # If a scheduled run still starts during working hours, the 31-shard
      # matrix would hold most of the 20 runner slots and queue every PR, so
      # a schedule run that starts between 07:00 and 19:59 UTC skips the
      # mutation matrix. A manual dispatch always runs it.
      - id: window
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$(date -u +%-H)
          if [ "$EVENT" = schedule ] && [ "$hour" -ge 7 ] && [ "$hour" -lt 20 ]; then
            echo "Started late ($(date -u +%H:%M) UTC): skipping the mutation matrix." >> "$GITHUB_STEP_SUMMARY"
            echo "mutate=false" >> "$GITHUB_OUTPUT"
          else
            echo "mutate=true" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    name: Nightly mutation baseline (${{ matrix.shard }})
    needs: pin
    if: needs.pin.outputs.mutate == 'true'
    runs-on: ubuntu-latest
    # The owner's ceiling is 90 min wall-clock per night. Shards run as parallel
    # jobs, so this bounds one shard's wall time. Stryker managed about 1500-1800
    # mutants per hour per shard on the 2026-10-15 run (2 checker and 2 test
    # runner processes on ubuntu-latest), and the old six shards held 2k-7k
    # mutants each, so all but one were cancelled at the timeout. Each shard now
    # holds at most ~1300 estimated mutants (~50-60 min), leaving headroom for
    # the repeated npm ci + initial test run. Enforced, not hoped for.
    timeout-minutes: 90
    strategy:
      # One failing shard must not cancel the others: the baseline is only
      # meaningful if every shard reports.
      fail-fast: false
      matrix:
        shard:
          - livekit-1
          - livekit-2
          - livekit-3
          - livekit-4
          - livekit-5
          - livekit-6
          - audio-media-1
          - audio-media-2
          - audio-media-3
          - transport-auth-1
          - transport-auth-2
          - transport-auth-3
          - transport-auth-4
          - lib-rest-1
          - lib-rest-2
          - lib-rest-3
          - lib-rest-4
          - lib-rest-5
          - lib-rest-6
          - lib-rest-7
          - lib-rest-8
          - lib-rest-9
          - stores-1
          - stores-2
          - stores-3
          - stores-4
          - safety-moderation-1
          - safety-moderation-2
          - safety-moderation-3
          - safety-moderation-4
          - safety-moderation-5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false
      # Detach to the pinned revision with git rather than a dynamic checkout
      # ref, so the npm cache step below never follows a non-literal ref.
      - name: Check out the pinned dev revision
        env:
          PIN_SHA: ${{ needs.pin.outputs.sha }}
        run: |
          git fetch --depth=1 origin "$PIN_SHA"
          git checkout --detach "$PIN_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
        working-directory: Client
      - run: node scripts/check-mutation-shards.mjs
        working-directory: Client
      - name: Run mutation shard
        working-directory: Client
        env:
          STRYKER_SHARD: ${{ matrix.shard }}
        run: npx stryker run stryker.shard.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-report-${{ matrix.shard }}
          path: Client/reports/mutation/${{ matrix.shard }}/
          retention-days: 30

  mutation-score:
    # The one full-surface score (docs/archive/plans/b7-8-mutation-baseline-2026-09-20.md):
    # statuses are summed across shards, never averaged. Fails when a shard
    # report is missing, since a partial score is not the full-surface score.
    # Not a required status context; it only exists on the nightly.
    name: Nightly full-surface mutation score
    needs: [pin, mutation]
    if: always() && needs.pin.outputs.mutate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false
      # Detach to the pinned revision with git rather than a dynamic checkout
      # ref, so the npm cache step below never follows a non-literal ref.
      - name: Check out the pinned dev revision
        env:
          PIN_SHA: ${{ needs.pin.outputs.sha }}
        run: |
          git fetch --depth=1 origin "$PIN_SHA"
          git checkout --detach "$PIN_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-report-*
          merge-multiple: false
          path: Client/reports/mutation-shards
      - run: node scripts/aggregate-mutation-shards.mjs reports/mutation-shards
        working-directory: Client
        env:
          PIN_SHA: ${{ needs.pin.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-score-summary
          path: Client/reports/mutation/summary.json
          retention-days: 30

  mutation-permissions:
    name: Nightly permission mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
        working-directory: Client
      - run: npx stryker run stryker.ci.config.mjs
        working-directory: Client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: permission-mutation-report
          path: Client/reports/mutation/
          retention-days: 7

  fuzz-and-simulation:
    name: Nightly generated fuzzing and hub simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: Server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: node scripts/fuzz-ci.mjs
      - name: Long seeded simulation under the race detector
        working-directory: Server
        env:
          OWNCORD_SIM_STEPS: "10000"
        run: go test -race -count=1 -run '^TestHubSimulation$' ./ws/
      # No fuzz output/corpus artifact: this repository is public. A generated
      # reproducer is committed only with its fix (Server/Makefile policy).

  query-benchmarks:
    # The read-path benchmarks on a synthetic 400k-message database, run at dev
    # and at the ref in Server/testdata/bench/query-baseline.json, alternating on
    # this one runner so both see the same machine. bench-gate.mjs fails on an
    # allocation increase or a median slowdown over 20 % against the ref.
    name: Nightly query benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: Server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Build the benchmark binaries at dev and at the ref
        working-directory: Server
        run: |
          ref=$(node -p 'require("./testdata/bench/query-baseline.json").ref')
          git worktree add --detach "$RUNNER_TEMP/bench-ref" "$ref"
          # The ref may predate the benchmark file; the current one only uses
          # the exported db API, so it is copied in.
          cp db/query_perf_bench_test.go "$RUNNER_TEMP/bench-ref/Server/db/"
          go test -c -o "$RUNNER_TEMP/db-cur.test" ./db
          (cd "$RUNNER_TEMP/bench-ref/Server" && go test -c -o "$RUNNER_TEMP/db-ref.test" ./db)
      - name: Run them alternately
        working-directory: Server/db
        run: |
          bench() {
            "$RUNNER_TEMP/db-$1.test" -test.run '^$' -test.bench 'SearchCommonWord|HistoryPage|UnreadCounts' \
              -test.benchtime 1s -test.benchmem >> "$RUNNER_TEMP/bench-$1.txt"
          }
          for round in 1 2 3 4; do
            bench cur; bench ref
            bench ref; bench cur
          done
      - name: Gate
        run: >-
          node Server/scripts/bench/bench-gate.mjs
          --baseline Server/testdata/bench/query-baseline.json
          --current "$RUNNER_TEMP/bench-cur.txt"
          --ref "$RUNNER_TEMP/bench-ref.txt"
          --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: query-benchmarks
          path: ${{ runner.temp }}/bench-*.txt
          retention-days: 30

  long-session-soak:
    # B7-11: the long run of the long-session soak (Client/playwright.config.soak.ts:
    # 200 cycles, then 30 idle-connected minutes). The PR soak (20 cycles) gates
    # every client-fullstack run; this is the same spec at length. Setup mirrors
    # ci.yml's client-fullstack job.
    name: Nightly long-session soak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: Server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        timeout-minutes: 12
        uses: ./.github/actions/playwright-install # zizmor: ignore[self-repository] actionlint 1.7.7 rejects the $/ form
      - run: node tests/e2e/scripts/install-livekit.mjs
      - name: Long-session soak, real server and encrypted decoded media
        env:
          OWNCORD_E2E_LIVEKIT_BINARY: tests/e2e/.bin/livekit-server
        run: npm run test:e2e:soak
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: long-session-soak-report
          path: |
            Client/playwright-report/
            Client/test-results/
          retention-days: 7
