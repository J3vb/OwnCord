name: Nightly Test Depth

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-test-depth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Nightly permission mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
        working-directory: Client
      - run: npx stryker run stryker.ci.config.mjs
        working-directory: Client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: permission-mutation-report
          path: Client/reports/mutation/
          retention-days: 7

  fuzz-and-simulation:
    name: Nightly generated fuzzing and hub simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: Server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/fuzz-ci.mjs
      - name: Long seeded simulation under the race detector
        working-directory: Server
        env:
          OWNCORD_SIM_STEPS: "10000"
        run: go test -race -count=1 -run '^TestHubSimulation$' ./ws/
      # No fuzz output/corpus artifact: this repository is public. A generated
      # reproducer is committed only with its fix (Server/Makefile policy).
