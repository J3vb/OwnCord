name: CI

on:
  # dev is deliberately not a push trigger: while a dev -> main PR is open every
  # push to dev already fires pull_request(synchronize), so listing it here ran
  # the whole suite twice for one push. Use workflow_dispatch for a dev branch
  # with no PR open yet.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which of the jobs below run. The rules — and the cross-boundary
  # dependencies they were traced from — are documented in scripts/ci-select.mjs,
  # and its unit suite runs inside the Repository Hygiene check.
  #
  # Two properties of this job are load-bearing. It has no `if:` of its own, and
  # it is expected to succeed on every event: the jobs below take it as a
  # `needs:`, and a job whose dependency did not succeed is skipped. The
  # "not a pull request into dev" case is therefore answered inside the step
  # (`--all`) rather than by skipping this job, so that "this job ran" and
  # "these outputs exist" are the same statement.
  #
  # Selection is deliberately limited to a pull request INTO DEV. A PR into main
  # and a push to main run every capability, because
  # scripts/verify-gate-evidence.mjs (R-09 / RL-16) requires each context in
  # docs/plans/b0-dev-branch-protection.sh to have concluded `success` on the
  # tagged commit and counts `skipped` as NOT success. Releases are cut from
  # main, so a check legitimately skipped there would block the release instead
  # of saving anything. Day-to-day work happens on PRs into dev, which is where
  # the long runs the audit measured came from.
  changes:
    name: Change selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.select.outputs.server }}
      client: ${{ steps.select.outputs.client }}
      rust: ${{ steps.select.outputs.rust }}
      browser: ${{ steps.select.outputs.browser }}
      integration: ${{ steps.select.outputs.integration }}
      native: ${{ steps.select.outputs.native }}
      harness: ${{ steps.select.outputs.harness }}
      workflows: ${{ steps.select.outputs.workflows }}
      deps: ${{ steps.select.outputs.deps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The diff is taken from the merge base, so both ends of it have to be
          # present. docs-consistency fetches full history for the same reason.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      # `set -e` is deliberately NOT set: the guards below are explicit `if !`
      # tests, because a git command that FAILED is a reason to select
      # everything, never a reason to skip every job that follows.
      #
      # But "this step cannot fail" is not the property to want, and an earlier
      # version of this step aimed for it: each `--all` branch ended in an
      # unconditional `exit 0`, so a selector invocation that died wrote nothing
      # and the step still SUCCEEDED. `needs.changes.result` was then `success`
      # with every output empty, `outputs.X == 'true'` was false everywhere, and
      # the run skipped all nine gated jobs AND every step of both server legs —
      # a green pull request with no check behind it. That branch is also the one
      # every push to main and every PR into main takes.
      #
      # So the rule is the opposite: a selection that could not be COMPUTED must
      # fail this step, because a failed step means `result != 'success'`, which
      # every gated condition reads as "run". Failing here is safe by
      # construction; exiting 0 with no answer is not.
      #
      # Nothing writes to $GITHUB_OUTPUT until the assertion at the bottom has
      # seen a complete answer. Writing through a scratch file also keeps a
      # half-written primary run from leaving duplicate keys behind when the
      # fallback appends a second copy.
      - name: Select the jobs this change needs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          answer="$RUNNER_TEMP/selection.txt"
          : > "$answer"

          # The conservative answer, and the only way to write it: a `--all` that
          # fails takes the job down with it rather than passing silently.
          select_all() {
            if ! node scripts/ci-select.mjs --all --reason "$1" --out "$answer"; then
              echo "::error::ci-select --all failed ($1) — failing this job so every gated job runs"
              exit 1
            fi
          }

          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "dev" ]; then
            select_all "not a pull request into dev"
          else
            base=""
            base=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null) || base=""
            changed="$RUNNER_TEMP/changed-paths.txt"

            if [ -z "$base" ]; then
              echo "::warning::no merge base against origin/$BASE_REF — running every check"
              select_all "no merge base"
            elif ! git diff --name-status -M "$base" HEAD > "$changed"; then
              echo "::warning::diff against $base failed — running every check"
              select_all "diff failed"
            elif ! node scripts/ci-select.mjs --paths-file "$changed" --out "$answer"; then
              echo "::warning::selection failed — running every check"
              : > "$answer"
              select_all "selection failed"
            fi
          fi

          # The assertion the whole fail-safe rests on. Every capability must be
          # present with a decided value; anything less is an answer this job did
          # not actually produce, and publishing it would skip jobs on silence.
          # The expected names come from ci-select.mjs's own CAPABILITIES rather
          # than a third hand-written copy, so this cannot drift away from the
          # selector it is checking.
          caps=$(node -e 'import("./scripts/ci-select.mjs").then((m) => console.log(m.CAPABILITIES.join(" ")))') || {
            echo "::error::could not read CAPABILITIES from scripts/ci-select.mjs"
            exit 1
          }
          missing=""
          for cap in $caps; do
            grep -qE "^${cap}=(true|false)$" "$answer" || missing="$missing $cap"
          done
          if [ -n "$missing" ]; then
            echo "::error::the selection is missing:$missing — failing this job so every gated job runs"
            cat "$answer"
            exit 1
          fi

          cat "$answer" >> "$GITHUB_OUTPUT"
          cat "$answer"

  server-build-test:
    name: Server Build & Test (${{ matrix.os }})
    needs: changes
    # This job runs on EVERY event; the selection is applied to its STEPS.
    #
    # It cannot carry a job-level `if:`. Both names on the required-check list
    # are the EXPANDED matrix names — `Server Build & Test (ubuntu-latest)` and
    # `(windows-latest)` — and a job-level `if:` is evaluated BEFORE matrix
    # expansion, so a skipped matrix job reports ONE context under the
    # unexpanded name instead. That was probed on this repository rather than
    # reasoned about: a commit with `if: false` here produced a single context
    # named `Server Build & Test (${{ matrix.os }})`, and the two required names
    # were never created at all. A required check that never reports blocks
    # every PR forever, which is the one failure mode this must not have.
    # `Server Docker Build (verify, linux/${{ matrix.arch }})` reports under
    # exactly that unexpanded form on every dev PR today, which is the same
    # behaviour.
    #
    # So the matrix always expands and both required contexts always
    # materialise. Be honest about the price: because the gating is per-step,
    # a leg that ran NO server check still reports `success` rather than
    # `skipped`. On a pull request into dev a green `Server Build & Test` can
    # therefore mean "the server legs were not selected for this diff" instead
    # of "the server was tested" — read the `Decide whether this leg runs` step
    # in the log to tell the two apart.
    #
    # That is not what keeps release evidence sound; `--all` on main is. A
    # tagged commit lives on main, where the selector selects every capability,
    # so the run scripts/verify-gate-evidence.mjs (R-09) reads at tag time is a
    # full one. What this job must never do is fail to report at all, and that
    # is the property the comment above is about.
    #
    # `!cancelled()` is load-bearing even so: without a status function, a job
    # whose `needs:` did not succeed is skipped before its `if:` is considered.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: chatserver.exe
            # The published asset this OS upgrades FROM. Windows ships a bare
            # .exe, Linux a tarball that has to be extracted first.
            release_asset: chatserver.exe
          - os: ubuntu-latest
            binary: chatserver
            release_asset: chatserver-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Server/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The one place this leg reads the selection, and the FIRST thing it does
      # after checkout: the decision has to precede tool setup, or a change with
      # no server work still pays for a Go install, a Node install and a Go
      # cache restore on both matrix legs.
      #
      # `shell: bash` is not optional here. This matrix includes
      # windows-latest, whose default shell is pwsh, and `${SELECTED:-true}` is
      # bash parameter expansion that PowerShell rejects as an invalid variable
      # reference. Observed, not reasoned about: the Windows leg failed with
      # `ParserError` in a .ps1 file, exit 1. The fail-safe below still did its
      # job — the value was never written, so every later step ran rather than
      # skipped — but the step itself failed the leg, so the fix is the shell.
      #
      # Written so that a MISSING value means "run": every step below tests
      # `!= 'false'`, so if this step wrote nothing — or a later edit renamed the
      # variable — the leg runs in full rather than silently skipping every gate.
      # A gate that fails open is the failure this whole design exists to avoid,
      # so the comparison is against the value that means SKIP, never against the
      # one that means run.
      - name: Decide whether this leg runs
        shell: bash
        env:
          SELECTED: ${{ needs.changes.result != 'success' || needs.changes.outputs.server == 'true' }}
        run: |
          echo "RUN_SERVER=${SELECTED:-true}" >> "$GITHUB_ENV"
          # Printed as well as written, so the decision is readable in the log of
          # each leg rather than only inferable from which steps ran.
          echo "server checks selected: ${SELECTED:-true}"
          if [ "${SELECTED:-true}" != "true" ]; then
            echo "::notice::not selected for this change — this leg runs no server checks"
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: env.RUN_SERVER != 'false'
        with:
          go-version: "1.26"
          cache-dependency-path: Server/go.sum

      # scripts/coverage-floor.sh parses the floor file with node (the coverage
      # profile itself is still read by the same line-oriented awk pass). This
      # job never used node before, so the interpreter is pinned here rather than
      # inherited from whatever the runner image happens to ship — the step it
      # feeds is required, and a missing interpreter would surface as
      # "not a usable floor file", which is the wrong diagnosis. Not cached: the
      # job installs no npm dependencies.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.RUN_SERVER != 'false'
        with:
          node-version: 26

      - name: Build server
        if: env.RUN_SERVER != 'false'
        run: go build -o ${{ matrix.binary }} -ldflags "-s -w" .

      # release.yml smokes every shipped asset with this harness. Running it
      # here too means a regression in the harness itself is caught pre-merge
      # rather than at tag time — the same reason docker-smoke.sh is called from
      # all three workflows. It runs the built binary through the whole
      # owner-visible lifecycle: cold boot, migrate, healthy, graceful drain to a
      # clean exit, then restart on the same data directory.
      - name: Smoke server binary (boot, migrate, drain, restart)
        if: env.RUN_SERVER != 'false'
        run: go run ./cmd/smoke ./${{ matrix.binary }}

      # B6-8, standalone leg. The smoke above proves this build boots on an
      # EMPTY directory; this proves it takes over a PUBLISHED release's
      # populated one — migrated database, uploads, credential files, a live
      # session — and that restoring the pre-upgrade archive puts the old
      # version back on it. Upgrade and rollback are the two paths every
      # existing install takes, and nothing else here walks either one.
      #
      # Here rather than at tag time for the reason the smoke above is: a
      # regression in the harness should fail pre-merge. The CONTAINER leg
      # stays out of PR time — it costs building an image from the released
      # tag's source tree — and runs nightly and at release in
      # upgrade-rehearsal.yml, which also owns the workflow-level notes.
      #
      # Everything lands in a dot-directory under Server/: the go tool ignores
      # it, and a workspace-relative path is the one form Git Bash on Windows
      # and the Go harness read identically — an MSYS /tmp-style path from
      # mktemp would not resolve once Go handed it to CreateProcess.
      #
      # Two steps rather than one so GH_TOKEN's scope stops at the download.
      # A single step would put a GitHub token in the environment of the
      # released binary the harness spawns, which reads only OWNCORD_* and has
      # no business being handed one.
      - name: Download the release to upgrade from
        if: env.RUN_SERVER != 'false'
        shell: bash
        env:
          # Read-only, and only to fetch a release asset.
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.release_asset }}
        run: |
          set -euo pipefail
          dir=.rehearsal-from
          rm -rf "$dir"
          mkdir -p "$dir"
          tag=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName')
          if [ -z "$tag" ]; then
            echo "::error::no published release to rehearse an upgrade from"
            exit 1
          fi
          echo "upgrading from $tag"
          gh release download "$tag" --dir "$dir" --pattern "$ASSET" --pattern checksums.sha256
          # The release's own checksums.sha256 is the whole difference between
          # "we rehearsed the previous release" and "we rehearsed whatever
          # bytes came back". A missing line is as fatal as a mismatch: it
          # means nothing verified the download.
          awk -v a="$ASSET" '$2 == a' "$dir/checksums.sha256" > "$dir/asset.sha256"
          if [ ! -s "$dir/asset.sha256" ]; then
            echo "::error::$tag publishes no checksum for $ASSET — refusing to rehearse an unverified binary"
            exit 1
          fi
          if ! ( cd "$dir" && sha256sum -c asset.sha256 ); then
            echo "::error::$ASSET from $tag does not match its published checksum — refusing to rehearse an unknown binary"
            exit 1
          fi
          from="$dir/$ASSET"
          case "$ASSET" in
            *.tar.gz)
              tar xzf "$from" -C "$dir"
              from="$dir/chatserver"
              ;;
          esac
          chmod +x "$from"
          echo "REHEARSAL_FROM=$from" >> "$GITHUB_ENV"

      - name: Rehearse upgrade and rollback from the latest release
        if: env.RUN_SERVER != 'false'
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/smoke -upgrade -from "$REHEARSAL_FROM" "./${{ matrix.binary }}"

      # Phase B + C build-tag matrix. Each tag variant must compile so the
      # tag boundaries don't drift.
      - name: Build with -tags otel (Phase B Step 8)
        if: env.RUN_SERVER != 'false'
        run: go build -tags otel ./...
      - name: Build with -tags wazero (Phase C Step 9)
        if: env.RUN_SERVER != 'false'
        run: go build -tags wazero ./...
      - name: Build with -tags otel,wazero (full community-hub build)
        if: env.RUN_SERVER != 'false'
        run: go build -tags otel,wazero ./...

      - name: Go vulnerability check
        if: env.RUN_SERVER != 'false'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

      # Generated sqlc output must never drift from db/queries/. One leg of
      # the matrix is enough; make is not guaranteed on the Windows runner.
      - name: Verify generated sqlc output (make sqlc-verify)
        if: matrix.os == 'ubuntu-latest' && env.RUN_SERVER != 'false'
        run: make sqlc-install sqlc-verify

      # Protocol message-type constants (Go + TS) must never drift from
      # protocol/schema.json — the single source of truth.
      - name: Verify generated protocol constants (make protocol-verify)
        if: matrix.os == 'ubuntu-latest' && env.RUN_SERVER != 'false'
        run: make protocol-verify

      # The route, table and config-key index blocks in docs/ must never drift
      # from the mounted router, the migrated schema and config.Config's yaml
      # tags. Same one-leg rule as the two checks above.
      - name: Verify generated docs (make docs-verify)
        if: matrix.os == 'ubuntu-latest' && env.RUN_SERVER != 'false'
        run: make docs-verify

      - name: Run tests with race detection and coverage
        if: env.RUN_SERVER != 'false'
        run: go test -race -timeout 20m ./... -coverprofile=coverage.out -cover

      - name: Run tests with deadlock detection
        if: env.RUN_SERVER != 'false'
        run: go test -tags deadlock -count=1 ./...

      # Document gates. Both read a Markdown file OUTSIDE the Server module, so
      # Go's test cache does not record it as an input and the -race run above
      # answers a doc-only edit from cache. The deadlock leg happens to run them
      # with -count=1 today; this step says so on purpose, so narrowing that
      # leg's package set cannot silently drop the gates.
      #   cmd/dbinventory  -> docs/architecture/server-boundaries.md (B3-0)
      #   migrations       -> docs/architecture/community-services.md (B5-0)
      - name: Run document gates (-count=1)
        if: env.RUN_SERVER != 'false'
        run: go test -count=1 ./cmd/dbinventory/ ./migrations/

      # Tag-gated tests (DC-06 / T-2026-07-25-16). The build-tag matrix above
      # only COMPILES the otel/wazero variants; the tests behind those tags
      # (plugin/sandbox_wazero_test.go, telemetry/telemetry_otel_test.go,
      # api/recoverer_otel_test.go — the OC-0346 panic-log test, which this
      # step never executed until ./api/... was added) ran nowhere until this
      # step. Scoped to the packages that carry tagged files — every other
      # package is tag-invariant and already covered by the race run above.
      # One leg is enough; no -race (the runtime under the tag is the concern,
      # not new concurrency).
      #
      # admin/logstream_alloc_test.go (OC-0398) carries the INVERSE tag
      # `!race && !deadlock`: it needs a leg where NEITHER is set, which is
      # neither of the two universal legs above (each sets exactly one of
      # the two) nor this step's own -tags lines — so it gets its own plain
      # line here. Server/ci_tags_test.go guards this class going forward:
      # it fails if any tagged Server test file has no `go test` leg above
      # that both sets its tag and runs its package.
      #
      # `-run` narrows this leg to the tests that need a plain build, because
      # running the whole package here re-ran everything the two universal legs
      # already cover. Measured: the package is 62.6s, of which
      # TestSetupLimiter_ReapsStaleEntries is 60.00s and is UNTAGGED — it is in
      # the -race and deadlock legs already. This leg exists only for the
      # `!race && !deadlock` tests, so it runs only those (0.088s).
      # ci_tags_test.go now also requires the -run pattern to match every test
      # in every constrained file it claims to cover, so adding a second
      # `!race && !deadlock` test fails the guard instead of being silently
      # left out of the only leg that could run it.
      - name: Run tag-gated tests (-tags wazero, -tags otel)
        if: matrix.os == 'ubuntu-latest' && env.RUN_SERVER != 'false'
        run: |
          go test -tags wazero -count=1 ./plugin/...
          go test -tags otel -count=1 ./telemetry/... ./api/...
          go test -count=1 -run '^TestRingBuffer_WriteDoesNotAllocate$' ./admin/

      # Coverage ratchet (B3-6 item 1). Reads the profile the race step wrote,
      # but placed after the other test steps so a floor miss does not hide
      # their results. Linux leg only: the profile is not the same on both legs
      # — OS-tagged files swap in and out and several tests skip on Windows —
      # so the floors are pinned to one leg and the figure stays deterministic.
      # Ratchet rule in Server/CLAUDE.md.
      - name: Check coverage floor
        if: matrix.os == 'ubuntu-latest' && env.RUN_SERVER != 'false'
        run: bash scripts/coverage-floor.sh coverage.out

      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage-${{ matrix.os }}
          path: Server/coverage.out
          retention-days: 7

      # verify: false — the action's default `config verify` pass fetches
      # golangci-lint.run's JSONSchema over HTTPS before linting anything, so a
      # timeout on that host fails a required job having run zero linters (it
      # took main red on d352696). `golangci-lint run` rejects a bad config on
      # its own; the schema pass only bought a prettier error message, priced
      # at a third-party site inside the gate.
      - name: Lint
        if: env.RUN_SERVER != 'false'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          working-directory: Server/
          verify: false

  # ubuntu-latest deliberately: the client TS code has zero win32-conditional
  # paths (no process.platform / path.sep branches in src or the unit suites),
  # prettier pins endOfLine: lf and .gitattributes forces eol=lf, so a Windows
  # runner adds queue time without adding coverage. Windows-specific behavior
  # is covered where it exists: rust-tests and the tauri-build matrix.
  client-check:
    name: Client Static Checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.client == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Check resolved Tauri npm and Rust versions
        run: |
          node --test ../scripts/check-tauri-versions.test.mjs
          node ../scripts/check-tauri-versions.mjs

      - name: Install npm dependencies
        run: npm ci

      # Scoped to shipped dependencies. The remaining high findings are all one
      # advisory, brace-expansion <=5.0.7, reaching us only through dev tooling
      # (eslint, @vitest/coverage-v8, stryker). Those are already on their
      # latest versions, so no bump reaches the fix, and there is no patched
      # release in the 1.x/2.x lines they pin. Forcing every copy to 5.0.9 via
      # overrides was tried and broke the build: minimatch requires
      # brace-expansion as CJS and v5 is not callable that way, which took out
      # vitest's coverage provider. Nothing here ships to users; revisit when
      # eslint and @vitest/coverage-v8 widen their minimatch ranges.
      #
      # Run through scripts/npm-audit-gate.sh rather than bare: `npm audit`
      # exits 1 both for a finding and for an unreachable audit endpoint, so
      # the bare command turned a registry outage ("audit endpoint returned an
      # error") into a red check on a pull request that never touched the
      # client. The script keeps the gate, retries a transport failure, and is
      # fail-closed — only a recognised outage signature is forgiven.
      - name: Security audit (npm, shipped deps)
        run: bash ../scripts/npm-audit-gate.sh

      # The forgiveness above is exactly the shape that rots into a gate that
      # never runs, so the classifier is self-tested on every PR, like the
      # count and migration matchers in Docs & Ledger Consistency.
      - name: Self-test the audit-outage classifier
        run: bash ../scripts/npm-audit-gate.sh --selftest

      - name: Oxlint (fast correctness checks)
        run: npx oxlint --deny-warnings src/

      - name: Import cycles (ceiling 29, B7-10 lowers it)
        run: npm run lint:cycles

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: TypeScript check (Playwright specs)
        # The main tsconfig excludes tests/e2e from the app graph; this
        # project typechecks every tests/e2e spec + fixtures + the
        # playwright configs so type rot cannot hide there.
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: ESLint (type-aware rules)
        run: npx eslint src/

      - name: Knip (unused code & deps)
        # Blocking since the 2026-08-04 remediation: the '|| true' era let a
        # real unused-export finding sit invisible in every green run.
        run: npx knip

      # `tauri-build` proves the desktop app actually bundles, but it is the
      # slow three-OS job. This compiles the Tauri target on every client PR, so
      # a broken `vite.config.desktop.ts` fails on the PR that breaks it instead
      # of at `tauri build` time — and because it runs the same `build:desktop`
      # script `beforeBuildCommand` runs, the two cannot disagree about what
      # building the desktop app means.
      - name: Desktop build (Tauri target)
        run: npm run build:desktop

      # B7-7 bundle budgets. A separate scratch build (--manifest writes
      # dist-budget/, never the shipped dist/ that beforeBuildCommand emits)
      # followed by the gate. Fails closed: a missing manifest or a renamed
      # chunk is exit 2, over-budget is exit 1.
      - name: Bundle budgets
        run: npm run build:budget && npm run check:budgets

  # Unit tests live in their own job so a suite failure is visible as exactly one
  # failing check instead of masking the static gates above. The suite is GREEN
  # and must stay green — never "fix" a failing test by editing its assertions.
  # ubuntu-latest for the same reason as client-check above: jsdom-only vitest
  # with no platform-conditional code under test.
  # The automated half of G-04: a WATCHED document that states a finding count
  # the ledger contradicts fails here instead of quietly misleading a reader.
  # Coverage is OPT-IN, not automatic — only the documents in
  # check-doc-counts.mjs's WATCHED list are read, and a new count-carrying
  # document is unchecked until it is added there. That is deliberate: most plan
  # and scorecard documents state counts as DATED evidence ("totals 315 fixed /
  # 59 open -> 320 fixed / 54 open" for a run on a given day), correct as
  # written and wrong to rewrite when the ledger moves on. Watch a document only
  # when its counts are meant to track the live ledger.
  # Deliberately tiny — no npm ci, because the script imports nothing outside
  # node:. It also runs its own selftest, since the whole check rests on
  # patterns narrow enough not to cry wolf.
  docs-consistency:
    name: Docs & Ledger Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check-migrations.mjs diffs against origin/dev. The default shallow
          # fetch has no such ref, and the script fails closed rather than
          # passing blind, so this job needs the full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Check k6 harness measurement contracts (offline)
        run: node --test Server/scripts/k6/ws-load.test.mjs

      - name: Self-test the count matcher
        run: node --test scripts/check-doc-counts.test.mjs

      - name: Documents must agree with the findings ledger
        run: node scripts/check-doc-counts.mjs

      # A reference document that cites a repository path which no longer
      # exists reads fine and proves nothing. This lived inside
      # Server/migrations/community_services_doc_test.go until the change
      # selector landed: the cited paths are mostly under Client/ and docs/,
      # and a diff confined to those selects no server job, so the gate was
      # skipped by exactly the pull requests most likely to break it and the
      # dangling citation merged green. It belongs in this job because it
      # reads only Markdown and the existence of paths — no Go toolchain, no
      # selection. Self-tested first, for the same reason the two matchers
      # above are.
      - name: Self-test the citation checker
        run: node --test scripts/check-doc-citations.test.mjs

      - name: Watched documents must not cite paths that do not exist
        run: node scripts/check-doc-citations.mjs

      # OC-0395. A migration is recorded by filename with no content hash, so
      # editing one that has already shipped repairs nothing for the
      # installations that applied it and no error is ever raised. Self-tested
      # first, for the same reason the count matcher is.
      - name: Self-test the migration-immutability matcher
        run: node --test scripts/check-migrations.test.mjs

      - name: Shipped migrations must not be edited
        run: node scripts/check-migrations.mjs

      - name: Ledger schema is valid
        run: node .superpowers/render-ledger.mjs --check

      # release.yml writes protocol_epoch into the signed server-update
      # manifest with exactly this command, and release.yml only runs at tag
      # time — so the read is proven here, on every pull request.
      - name: protocol_epoch is readable the way release.yml reads it
        run: test "$(jq -e '.protocol_epoch' protocol/schema.json)" -ge 1

      # R-09 / RL-16. The release gate itself is only invoked for real at tag
      # time, which is the wrong place to find a bug in it — so its decision
      # logic is exercised here, on every pull request, against fixtures. Same
      # reason Server/scripts/docker-smoke.sh is called from all three
      # workflows (ci.yml, release.yml, nightly-docker-smoke.yml).
      # This also parses the required-check list out of
      # b0-dev-branch-protection.sh, so a change to that list's shape fails here
      # rather than silently weakening the gate.
      - name: Self-test the release gate
        run: node --test scripts/verify-gate-evidence.test.mjs

      # RL-07. FINDINGS.md is not tracked, so it cannot drift -- but L-07 also
      # asks that the rendering be reproducible and that CI reject a generation
      # failure. Rendering twice and comparing tests both: the render must
      # succeed (it validates and exits 1 before writing), and it must be a pure
      # function of the ledger. The severity rule in validate() is what makes
      # the second half true -- an unranked severity would make render()'s sort
      # implementation-defined.
      - name: FINDINGS.md renders, and renders identically twice
        run: |
          node .superpowers/render-ledger.mjs
          cp .superpowers/FINDINGS.md "$RUNNER_TEMP/FINDINGS.first.md"
          node .superpowers/render-ledger.mjs
          cmp "$RUNNER_TEMP/FINDINGS.first.md" .superpowers/FINDINGS.md || {
            echo "ERROR: rendering the ledger twice produced different output."
            echo "render() must be a pure function of findings-ledger.json."
            exit 1
          }

      # The rendering is the human-readable view and is deliberately untracked,
      # so this artifact is how a reviewer reads it without a Node run.
      # if: always() -- you want it downloadable precisely when the job failed.
      - name: Upload the rendered findings ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-ledger-rendering
          path: .superpowers/FINDINGS.md
          retention-days: 7

  # Repository-wide formatting, script lint and workflow lint (RL-19 / L-13, S-05).
  #
  # Root-scoped and ubuntu-only for the same reason as docs-consistency above:
  # every gate here is platform-independent text analysis, and .gitattributes
  # pins eol=lf so a second OS would only re-prove line endings.
  #
  # Prettier lives here rather than in client-check because it is no longer a
  # client gate -- one config at the repository root covers Markdown, YAML,
  # JSON, CSS and the root scripts as well as client TypeScript.
  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      # Root install only -- prettier is the sole dependency this job needs, and
      # the client's install is client-check's job.
      - name: Install root dependencies
        run: npm ci

      # shellcheck ships in the ubuntu runner image. actionlint does not, so it
      # is pinned by version and checked by digest: an unpinned installer script
      # would be the one unverified download in a workflow file that pins every
      # action by commit SHA.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "$url"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Report tool versions
        run: shellcheck --version && actionlint --version

      # The same entry point a contributor runs. run.mjs takes its shellcheck and
      # actionlint file lists from `git ls-files`, never a filesystem glob.
      - name: Formatting, shell and workflow gates
        run: npm run check:hygiene

  # RL-19's second half: actionlint validates expression syntax and action
  # inputs, and has no concept of who a trigger admits, what a run can persist,
  # or whether a release restores a poisoned cache. zizmor audits exactly that,
  # and it is the check for the class of defect that review missed in #1634.
  #
  # Gated on `workflows` (a `.github/**` change; `scripts/` also selects it,
  # because ci.yml is itself a shared input). Cheap: no npm ci, no Go, no Rust
  # — one pinned binary and a text pass, seconds not minutes.
  #
  # OFFLINE on purpose. The online audits (impostor-commit, ref-version-mismatch)
  # would fire on every deliberately branch-pinned `uses:` — dtolnay/rust-toolchain
  # and anthropics/claude-code-action both pin a moving branch — so enabling them
  # buys a permanent exception list and a network dependency, not signal. The
  # audits that catch real defects (template-injection, artipacked,
  # cache-poisoning, excessive-permissions) all run offline. zizmor exits
  # non-zero on any finding, so this check blocks on a NEW one with no baseline.
  workflow-lint:
    name: Workflow Security Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Pinned by version and checked by digest, the same convention the
      # actionlint install in Repository Hygiene follows: an unpinned installer
      # would be the one unverified download in a file that pins every action by
      # commit SHA.
      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/zizmor.tar.gz" "$url"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Report tool version
        run: zizmor --version

      - name: Audit the workflows (zizmor, offline)
        run: zizmor --offline --no-progress .github/workflows/

  # One vulnerability scan across every lockfile, plus cargo-deny for the
  # licence and source policy osv-scanner does not carry. Gated on `deps`: a
  # manifest, a lockfile, osv-scanner.toml or deny.toml. A source-only change
  # cannot move a version, so it does not pay for this.
  #
  # Both tools are clean at HEAD with the reviewed baselines committed at
  # osv-scanner.toml and Client/src-tauri/deny.toml; each exception names its
  # advisory and reason, so the jobs fail on anything NEW. Neither uses
  # `continue-on-error`, `|| true`, or any other fail-open path.
  #
  # The overlap with the existing gates is deliberate and named:
  #   - govulncheck (Server Build & Test) is call-aware and stays the Go
  #     authority; osv-scanner covers the module graph and the other ecosystems.
  #   - the npm audit step in Client Static Checks is scoped to shipped deps;
  #     osv-scanner covers the dev tree too, with dev-only findings baselined.
  #   - cargo audit in tauri-build runs only on PRs to main; this runs on every
  #     relevant change.
  supply-chain:
    name: Supply-chain Scan
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install osv-scanner
        env:
          OSV_VERSION: 2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/osv-scanner" "$url"
          echo "$OSV_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Every lockfile in the repository, named rather than globbed: a new
      # component's lockfile must be added here and to scripts/ci-select.mjs's
      # DEPS_FILES, so it cannot be silently unscanned.
      - name: Scan the dependency manifests (osv-scanner)
        run: |
          osv-scanner scan source --config osv-scanner.toml \
            -L Server/go.mod \
            -L Client/package-lock.json \
            -L Client/src-tauri/Cargo.lock \
            -L tools/mcp-introspect/package-lock.json \
            -L package-lock.json

      # cargo-deny reads the resolved graph through `cargo metadata`, so cargo
      # has to be on PATH. Pinned the same way rust-tests pins it.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/cargo-deny.tar.gz" "$url"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP" \
            --strip-components=1 "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Report tool versions
        run: osv-scanner --version && cargo-deny --version

      # Advisories, licences and sources under Client/src-tauri/deny.toml.
      - name: Check the Rust dependency policy (cargo-deny)
        run: cargo deny --manifest-path Client/src-tauri/Cargo.toml check

  client-tests:
    name: Client Unit Tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.client == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npx vitest run --coverage --reporter=default

      - name: Check client coverage floor
        if: always()
        run: bash scripts/coverage-floor.sh

      - name: Upload client coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-coverage
          path: Client/coverage/
          retention-days: 7

  # Rust unit tests used to live inside tauri-build, which only runs on PRs to
  # main — so #[cfg(test)] code never ran on pushes or on PRs to dev, and could
  # rot for a whole release cycle. This job runs them on every event. Clippy is
  # run with --all-targets here (tauri-build's lib-only clippy skips test code).
  rust-tests:
    name: Rust Unit Tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Client/src-tauri/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            libasound2-dev \
            libssl-dev \
            librsvg2-dev

      # The Linux client links livekit, whose webrtc-sys crate needs clang >= 21
      # and the prebuilt libwebrtc (~148 MB download, ~800 MB extracted). The
      # libwebrtc archive is cached here — an ordinary PR/branch cache — because
      # this job runs on every client change, and a cold download is the slow
      # part. clang-21 is an apt package and is installed fresh every run.
      #
      # The trust boundary is deliberate: this cache is populated by the same
      # kind of branch/PR runs that consume it, and this workflow neither is
      # tag-triggered nor publishes a runtime artifact. release.yml, which does
      # publish, restores NO cache (zizmor cache-poisoning, #1656) — it always
      # downloads and verifies the pinned sha256.
      - name: Cache libwebrtc
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/owncord-linux-webrtc
          key: linux-webrtc-${{ runner.arch }}-webrtc-89d790b-v2

      - name: Install native-voice build prerequisites
        run: bash ../scripts/linux-webrtc-toolchain.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Client/src-tauri

      # Self-test the glibc-floor matcher before trusting it (the same rule the
      # count/citation/migration matchers follow): a gate whose parser silently
      # stopped finding versions would pass every binary.
      - name: Self-test the glibc-floor matcher
        run: bash ../scripts/check-glibc-floor.sh --selftest

      # Ahead of clippy: a formatting failure is cheap to produce and cheap to
      # fix, and there is no reason to spend a clippy pass to surface one.
      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Clippy lint (including test targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --lib

      # Native-voice E2EE interop (Linux): the crate's own NativeSession
      # (examples/native_voice_interop.rs) against livekit-client in Chromium
      # over a local livekit-server, with the room key handed to both the way
      # the app does — proof that a Linux client decodes a Windows client and
      # vice versa, plus the wrong-key negative control. Lives here rather
      # than in a media job because the crate is already built in this cache;
      # the example is a dev-profile build of the same objects.
      - name: Build the native-voice interop peer
        run: cargo build --example native_voice_interop

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install npm dependencies
        working-directory: Client/
        run: npm ci

      - name: Install Playwright browser
        working-directory: Client/
        run: npx playwright install --with-deps chromium

      - name: Install livekit-server
        working-directory: Client/
        run: node tests/e2e/scripts/install-livekit.mjs

      - name: Native-voice E2EE interop test
        working-directory: Client/
        env:
          OWNCORD_E2E_LIVEKIT_BINARY: tests/e2e/.bin/livekit-server
          OWNCORD_NATIVE_VOICE_PEER: src-tauri/target/debug/examples/native_voice_interop
        run: npm run test:e2e:native-voice

      - name: Upload native-voice interop report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-voice-interop-report
          path: |
            Client/test-results/native-voice
            Client/test-results/native-voice.xml
          if-no-files-found: ignore

  # Mocked desktop boundary: unexpected IPC/page errors and flakes fail.
  client-e2e:
    name: Client E2E (Playwright)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Fast feedback by default. `client-e2e-parity` runs the complete
      # 292-test suite against the built bundle, and until this split this job
      # ran those same 292 against the dev server — the two configs share
      # testDir and testIgnore, so the jobs differed only in which server served
      # the app (10.8 and 8.8 minutes for one identical test set).
      #
      # So this leg runs the 92-test smoke set (Client/playwright.config.smoke.ts)
      # and widens back to the full 292 when the specs or their fixtures moved —
      # at that point the smoke set is no longer a fair sample of the change.
      # The two steps are complementary rather than a default and an override,
      # so exactly one runs; the full-suite condition doubles as the fail-safe,
      # running the full suite if the selection job did not succeed.
      - name: Run Playwright tests (full development suite)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.harness == 'true' }}
        run: npx playwright test --config=playwright.config.ts

      - name: Run Playwright tests (smoke)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.harness != 'true' }}
        run: npm run test:e2e:smoke

      # Browser-mode unit tests (tests/browser/): real AudioContext + WASM
      # behind the same Chromium, so the noise-suppression pipeline has a
      # test that actually runs somewhere (test-audit 2026-08-19, T-22).
      - name: Run browser-mode unit tests
        run: npm run test:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            Client/playwright-report/
            Client/test-results/
          retention-days: 7

  # Each admin attempt owns a fresh real server and database.
  admin-e2e:
    name: Admin Panel E2E (real server)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: Server/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run admin-panel journey
        run: npm run test:e2e:admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-e2e-report
          path: |
            Client/playwright-report/
            Client/test-results/
          retention-days: 7

  # Built production assets catch bundling/worker regressions independently.
  # Keep the historical check name: live branch protection already requires it.
  client-e2e-parity:
    name: Client E2E (parity subset, blocking)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run production e2e specs
        run: npm run test:e2e:prod

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-parity
          path: |
            Client/playwright-report/
            Client/test-results/
          retention-days: 7

  # Image build is verification only, so it is skipped on dev to keep day-to-day
  # work on the fast check suite. Runs for main pushes and PRs targeting main.
  #
  # Keep in sync with nightly-docker-smoke.yml's nightly-docker-smoke job.
  server-docker-build:
    name: Server Docker Build (verify, linux/${{ matrix.arch }})
    if: github.ref_name == 'main' || github.base_ref == 'main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Both published architectures, each on its own hardware (B6-2). Running
    # the arm64 image under QEMU would prove only that binfmt can interpret it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: Server/
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: owncord-smoke:candidate
          build-args: VERSION=ci
          cache-from: type=gha,scope=ci-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-server-${{ matrix.arch }}

      # Same script release.yml runs before it signs or pushes anything. A
      # lifecycle regression — or a bug in the smoke harness itself, as happened
      # on the first v1.2.0-alpha.3 release run — must fail here, not at tag time.
      - name: Lifecycle-smoke Docker image
        run: bash Server/scripts/docker-smoke.sh owncord-smoke:candidate

  # Full Tauri build only on PRs to main (expensive: ~15 min x2 multiplier).
  #
  # Skipped for Dependabot: its PRs run under the separate `dependabot` secrets
  # scope, so TAURI_SIGNING_PRIVATE_KEY arrives empty and `npm run tauri build`
  # always aborts with "failed to decode secret key" while signing the updater
  # artifact — after a successful compile and bundle. That burned ~50 min of
  # runner time per dependency PR to produce a red check that never carried any
  # signal. Granting Dependabot the signing key would fix the symptom but hands
  # a release key to workflows triggered by third-party dependency updates.
  #
  # What still covers Dependabot PRs: the required `rust-tests` job compiles the
  # crate (cargo clippy --all-targets + cargo test --lib), so a dependency bump
  # that breaks the Rust build is still caught.
  # What this gives up on those PRs: bundling (NSIS/AppImage/deb), Windows and
  # ARM-specific compilation, and the `cargo audit` step below — that last one
  # overlaps with Dependabot's own cargo scanning, which is what opens these PRs
  # in the first place.
  tauri-build:
    name: Tauri Full Build (${{ matrix.os }})
    needs: client-check
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'main'
      && github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            libasound2-dev \
            libssl-dev \
            patchelf \
            librsvg2-dev \
            xdg-utils

      # Same clang + libwebrtc prerequisite as rust-tests, libwebrtc cached per arch.
      - name: Cache libwebrtc
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/owncord-linux-webrtc
          key: linux-webrtc-${{ runner.arch }}-webrtc-89d790b-v2

      - name: Install native-voice build prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: bash scripts/linux-webrtc-toolchain.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Client/src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Clippy lint (Rust)
        working-directory: Client/src-tauri/
        run: cargo clippy -- -D warnings

      # Rust unit tests moved to the standalone `rust-tests` job so they run on
      # every event, not just PRs to main.

      - name: Security audit (Rust dependencies)
        working-directory: Client/src-tauri/
        run: |
          cargo install cargo-audit@0.22.1 --quiet
          cargo audit

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # The release build host is Ubuntu 22.04 precisely so the shipped binary
      # starts on older distros. Linking the prebuilt libwebrtc could raise that
      # floor without anything else noticing, so assert it on the binary this
      # leg just produced — and on arm64, where the artefact differs.
      - name: Check the binary's glibc floor
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: Client/
        run: bash scripts/check-glibc-floor.sh src-tauri/target/release/owncord-client

  client-fullstack:
    name: Client E2E (real server and media)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: Server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/scripts/install-livekit.mjs
      - name: Test two clients, real server and encrypted decoded media
        env:
          OWNCORD_E2E_LIVEKIT_BINARY: tests/e2e/.bin/livekit-server
        run: npm run test:e2e:fullstack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fullstack-e2e-report
          path: |
            Client/playwright-report/
            Client/test-results/
          retention-days: 7

  client-native:
    name: Client E2E (Windows native)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: Client/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: Server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Check resolved Tauri npm and Rust versions
        run: node ../scripts/check-tauri-versions.mjs
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Client/src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run test:e2e:build-server
      - run: node tests/e2e/scripts/install-livekit.mjs
      # Release optimization, separate identity and API-configured WebView2 debugging.
      - run: node tests/e2e/scripts/native-test-config.mjs
      - id: native_build
        run: npm run tauri build -- --no-bundle --config tests/e2e/.bin/tauri.native.json
      - name: Test actual Rust transport and WebView2
        env:
          OWNCORD_E2E_LIVEKIT_BINARY: tests/e2e/.bin/livekit-server.exe
        run: npx playwright test --config playwright.config.native.ts --project native-core
      # The exploratory suites were defined in the config but never selected, so
      # nine spec files were dead coverage. They reuse the binary built above
      # (native-no-auth drives the real connect page and auth flows;
      # native-authenticated logs in once and exercises layout, channel nav,
      # chat, DMs, settings, appearance and overlays; native-extra covers
      # window state, tray status, reload/DevTools keys, external links and
      # push-to-talk). The persistent fixture needs the LiveKit binary the same
      # way native-core does.
      # Own output paths: Playwright clears its output directory and the
      # reporters overwrite theirs when a run starts, so sharing native-core's
      # would erase the core diagnostics before they are uploaded.
      - name: Test native auth, layout and overlay suites
        timeout-minutes: 25
        env:
          OWNCORD_E2E_LIVEKIT_BINARY: tests/e2e/.bin/livekit-server.exe
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/native-suites
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/native-suites.xml
        run: >-
          npx playwright test --config playwright.config.native.ts
          --project native-no-auth --project native-authenticated
          --project native-extra
          --output test-results/native-suites
      - name: Preserve native core and suite diagnostics before building installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-core-e2e-report
          path: |
            Client/playwright-report/native/
            Client/playwright-report/native-suites/
            Client/test-results/native/
            Client/test-results/native-suites/
            Client/test-results/native-junit.xml
            Client/test-results/native-suites.xml
          retention-days: 7
      # Collect installer evidence even if a core test fails; the job still fails.
      - name: Build two signed NSIS test packages
        id: native_packages
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: node tests/e2e/scripts/build-native-updates.mjs
      - name: Test actual signed desktop installation and relaunch
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.native_packages.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/native-updater
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/native-updater.xml
        run: node tests/e2e/scripts/run-native-updater.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-e2e-report
          path: |
            Client/playwright-report/
            Client/test-results/
          retention-days: 7

  # Workstream 17 asks for a refused unsupported major to be verified, and only
  # a real other-major Node can do it: `npm install --node-version=23` exits 0
  # against `>=24`, because the flag does not feed the root-package engine check.
  # So this job installs a wrong Node on purpose and requires the refusal.
  #
  # `set +e` is load-bearing: GitHub starts the step as `bash -e -o pipefail`, so
  # `-e` is already on from the command line and leaving it out of `set` does
  # not turn it off — the first expected `npm ci` failure would abort the step
  # silently, before its exit code could be read. Each exit code is captured
  # before any pipe, for the same reason.
  #
  # Deliberately not on any required-checks list: it is a hard-failing job that
  # is visible on every PR. `scripts/check-node-policy.mjs` skips this pin
  # because of its trailing comment, so the two do not contradict each other.
  node-policy:
    name: Node policy (refused major)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.client == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24" # deliberately NOT the supported major

      # `--ignore-scripts` is correct here only: the install is meant to fail
      # before any script runs, so nothing should be executed on the way down.
      - name: Every package root must refuse a wrong major
        shell: bash
        run: |
          set +e
          set -uo pipefail
          for d in . Client tools/mcp-introspect; do
            out=$(cd "$d" && npm ci --ignore-scripts 2>&1)
            rc=$?
            if [ "$rc" -eq 0 ] || ! grep -q EBADENGINE <<<"$out"; then
              echo "::error::$d accepted Node 24 (exit $rc) -- engine-strict is not refusing"
              echo "$out"
              exit 1
            fi
            echo "$d refused Node 24: $(grep -m1 EBADENGINE <<<"$out")"
          done
