# The BPR-030 capacity profile: 250 registered users, 100 simultaneous
# connections, 25 concurrent voice participants — measured, not asserted (B6-9).
#
# TWO LEGS, AND ONLY ONE OF THEM PUBLISHES.
#
#   constrained — the server runs inside a cgroup pinned to 2 CPUs with 4 GB
#                 and no swap: the reference hardware from the PRD (2 vCPU /
#                 4 GB / SSD Linux x64), reproduced rather than owned. EVERY
#                 published number in docs/capacity.md comes from this leg.
#   ceiling     — the old unconstrained boot on the whole runner. Informational
#                 only: it shows headroom, and its thresholds do not fail the
#                 job. Quoting it as capacity is the exact mistake B6-9 exists
#                 to prevent, and so is quoting the 16-core bench baseline in
#                 docs/plans/b3-bench-baseline-2026-09-01.md.
#
# --cpuset-cpus is the flag that matters, not --cpus. --cpus is a CFS quota;
# runtime.NumCPU() reads the CPU affinity mask, so under --cpus alone the
# server would size GOMAXPROCS and its bcrypt admission budget
# (auth/admission.go: 2 x NumCPU) for the runner's four cores — believing it
# had hardware the cgroup will not let it use. Both are passed: the cpuset for
# what the runtime sees, the quota for what it may consume.
#
# The load generators are deliberately OUTSIDE that budget and pinned to the
# other two CPUs with taskset. A generator sharing the server's cores measures
# the generator.
#
# debian:bookworm-slim with the release binary mounted, not the published
# distroless image: that image ships no shell and cannot host the companion
# livekit-server process this profile needs. The capacity claim is about the
# machine budget; the packaging is qualified by B6-1's and B6-2's lifecycle
# smokes (cmd/smoke, docker-smoke.sh).
#
# workflow_dispatch AND a weekly schedule, and deliberately not part of the
# blocking CI matrix: a perf run on shared runners is a flake source and a
# wall-clock tax the pipeline doesn't need. Like the bench baseline, these
# numbers are recorded and published, never gated.
#
# The weekly schedule is RE-05's regression watch: it re-measures the
# constrained profile once a week and uploads the artifacts, so a capacity
# regression is visible in the Actions history instead of waiting for someone
# to dispatch a run. It is inert until this file is carried to the default
# branch (GitHub registers a `schedule:` only when the file exists on main, the
# same rule nightly-docker-smoke.yml:14-15 states), and a scheduled run then
# measures the workflow's own commit, so the wiring here and the harness it
# drives are always the same revision. To measure dev, dispatch with
# `--ref dev`. A scheduled run lands its checks on the DEFAULT branch, where no
# context here is required.
#
# Re-run it deliberately before a release, or after changes to the hub, the
# write path or the replay budget.
#
# FIVE PROFILES (B6-10, P5-S01), one cgroup recipe. `inputs.profile` selects the
# scenario set inside Server/scripts/k6/ws-load.js; the legs and the extra
# environment follow from it:
#
#   capacity (default) — the B6-9 run, unchanged. Both legs. 25 k6 voice VUs
#     AND the lk SFU cohort, one text channel, no extra server env.
#   operational — the 100-connection sustain plus, concurrently, the per-phase
#     observer, the reconnect storm, voice churn and upload admission. ONE leg
#     (constrained) TWICE: `tls: self_signed` and `tls: off`. That pair is the
#     TLS row — a delta between two runs of the same profile on the same cgroup,
#     never a promise about running TLS-less. `OWNCORD_UPLOAD_USER_QUOTA_MB=1`
#     makes the 507 quota-refuse path reachable inside the 10/min upload limit,
#     which is the only reason that value is there. No lk cohort: the churn
#     exercises the control plane, not the media path.
#   restart — 100 connections at the capacity rate while the WORKFLOW, not k6,
#     stops the server between equal steady windows (T+135s) and restarts the
#     same container. The drill gates the whole stop at 30 s, not the 20 s an
#     idle server proves, and fails on a non-zero exit or a drain over 30 s.
#     That is deliberately stricter than the server's 50 s hard cap
#     (internal/app/lifecycle.go teardownBudget; httpDrainBudget alone may take
#     30 s for a slow transfer): a restart with no slow transfers in flight
#     must still finish well inside it.
#   ceiling-search — one ramping-vus scenario stepping connections from 100 to
#     `inputs.ceiling_max`, a 30 s ramp then a 60 s hold per step, to find the
#     step where a capacity budget first breaks. Constrained-only: a ceiling
#     measured outside the reference cgroup is the number B6-9 exists to
#     prevent. Seeds `ceiling_max` users and boots with
#     OWNCORD_SERVER_MAX_WS_CONNECTIONS at twice the probe maximum, so a config
#     cap can never be published as the ceiling the search "found" — the run
#     asserts ws_conn_rejects stayed 0.
#   scale — what 1,000-2,000 people online do (P5-S01, owner decision D2):
#     `scale_connections` held (default 2,000), a small active fraction
#     sending, then a burst minute, a login burst from distinct addresses, and
#     a herd in which every socket redials a full `ready`. Constrained-only.
#     Boots with `server.trusted_proxies: ["127.0.0.1/32"]` and gives every
#     seeded user and every VU its own X-Forwarded-For address, so per-IP
#     limits see distinct people — a MEASUREMENT setting, never a deployment
#     recommendation. Registration runs 2 x NumCPU in parallel and keeps each
#     session token, so VUs start from a token as a returning client does.
#
# The restart, ceiling-search and scale profiles set no voice channel: their voice leg
# is off, both in the script (no K6_VOICE_VUS) and in the server load, because
# neither measures the media path.
name: Load Baseline

on:
  # RE-05's weekly regression watch. A schedule only ever runs from the default
  # branch, so this file does nothing until it reaches main and then measures
  # main's commit every week.
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: "Which scenario set to measure (B6-10)"
        required: false
        type: choice
        default: capacity
        options:
          - capacity
          - operational
          - restart
          - ceiling-search
          - scale
      users:
        description: "Registered users to seed (BPR-030 says 250)"
        required: false
        default: "250"
      connections:
        description: "Peak simultaneous WebSocket connections (BPR-030 says 100)"
        required: false
        default: "100"
      voice:
        description: "Concurrent voice participants (BPR-030 says 25)"
        required: false
        default: "25"
      churn_phase:
        description: "operational: voice churn shape — spread (default) or aligned (the deliberate burst)"
        required: false
        type: choice
        default: spread
        options:
          - spread
          - aligned
      ceiling_max:
        description: "ceiling-search: highest connection count probed (and users to seed)"
        required: false
        default: "500"
      scale_connections:
        description: "scale: connections held (D2 says 2000)"
        required: false
        default: "2000"
      scale_active:
        description: "scale: fraction of connections that send (D2 says 0.1)"
        required: false
        default: "0.1"
      scale_burst_send_ms:
        description: "scale: per active user send interval in the burst minute, ms (2000 = 100 msg/s at the defaults)"
        required: false
        default: "2000"
      scale_herd_spread_s:
        description: "scale: seconds over which every socket drops and redials (D3 says 15)"
        required: false
        default: "15"

permissions:
  contents: read

env:
  # The livekit-server release OwnCord itself downloads
  # (ws.DefaultLiveKitVersion). Measuring a different SFU release than the
  # product ships would measure something no owner ever runs.
  LIVEKIT_VERSION: "1.13.7"
  LK_CLI_VERSION: "2.18.6"

jobs:
  baseline:
    name: ${{ inputs.profile || 'capacity' }} (${{ matrix.leg }}${{ matrix.tls == 'off' && ', tls off' || '' }})
    # A scheduled run has no inputs, so every `inputs.X` below carries the
    # same default the dispatch input declares. `|| 'x'` is the whole of the
    # scheduled-vs-dispatched logic.
    runs-on: ubuntu-latest
    # 45 min covers every profile whose k6 run is ~4.5 min (60 s ramp + 180 s
    # sustain + 20 s drain) on top of the build, boot and seeding. The ceiling
    # search is the outlier at both ends: its schedule is 5 steps x (30 s ramp
    # + 60 s hold) + 20 s drain ~= 8 min, and it seeds `ceiling_max` users at
    # bcrypt cost 12 on two cores (~0.5 s each, ~4 min at the 500 default)
    # before any of it starts — so it gets the headroom the plan's risk row
    # promised rather than a timeout in the middle of a probe.
    # scale seeds scale_connections + 501 users at cost 12 (~10 min on two
    # cores) and runs ~11 min of k6 after its VUs initialise.
    timeout-minutes: ${{ (inputs.profile || 'capacity') == 'ceiling-search' && 75 || ((inputs.profile || 'capacity') == 'scale' && 90 || 45) }}
    # Per-run parameters, so the profile logic is one derive step rather than
    # an `if:` on a dozen steps. These sit at job scope, not workflow scope:
    # `matrix` is not an available context in the workflow-level `env:` block.
    # TLS_MODE is `matrix.tls` (always self_signed outside the operational
    # profile) and drives both the URL scheme and the server's own tls.mode.
    env:
      PROFILE: ${{ inputs.profile || 'capacity' }}
      TLS_MODE: ${{ matrix.tls }}
      CEILING_MAX: ${{ inputs.ceiling_max || '500' }}
      SEED_USERS_INPUT: ${{ inputs.users || '250' }}
      CONNECTIONS: ${{ (inputs.profile || 'capacity') == 'scale' && (inputs.scale_connections || '2000') || inputs.connections || '100' }}
      SCALE_ACTIVE: ${{ inputs.scale_active || '0.1' }}
      SCALE_BURST_SEND_MS: ${{ inputs.scale_burst_send_ms || '2000' }}
      SCALE_HERD_SPREAD_S: ${{ inputs.scale_herd_spread_s || '15' }}
      VOICE: ${{ inputs.voice || '25' }}
    strategy:
      fail-fast: false
      matrix:
        # capacity keeps B6-9's two legs. Everything else is constrained-only:
        # the operational, restart and ceiling-search numbers all publish, and
        # a published number may only come from the reference cgroup.
        #
        # `tls` is a real matrix dimension only for operational, where the two
        # values are the two runs the TLS delta is computed from. Elsewhere it
        # is pinned at self_signed — the shipped default — so the scheme
        # expressions below stay total. The ceiling leg runs only for capacity,
        # as before: it is a labelled headroom check, not a second measurement.
        leg: ${{ fromJSON((inputs.profile || 'capacity') == 'capacity' && '["constrained", "ceiling"]' || '["constrained"]') }}
        tls: ${{ fromJSON((inputs.profile || 'capacity') == 'operational' && '["self_signed", "off"]' || '["self_signed"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # So the log of every run states which commit was measured instead of
      # leaving it to be re-derived from the trigger.
      - name: Print checked-out revision
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "event=$EVENT ref=$REF"
          git rev-parse HEAD

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          cache-dependency-path: Server/go.sum

      # A four-CPU runner is a precondition, not a detail: --cpuset-cpus=0,1
      # plus `taskset -c 2,3` needs four. On a two-CPU runner the generator and
      # the server would silently share both cores and every number would be
      # invalid while still looking plausible.
      - name: Assert the runner can host the split
        run: |
          echo "nproc=$(nproc)"
          if [ "$(nproc)" -lt 4 ]; then
            echo "::error::this runner has $(nproc) CPUs; the constrained leg needs 4 (2 for the server, 2 for the load generators)"
            exit 1
          fi

      - name: Build server
        working-directory: Server
        env:
          CGO_ENABLED: "0"
        run: go build -o chatserver .

      # Downloaded on the host and mounted in, rather than letting the server
      # auto-download it: the constrained container then needs no egress and no
      # CA bundle, the version is pinned in one place, and the SFU is running
      # before the first participant instead of arriving in the background.
      - name: Fetch and verify livekit-server ${{ env.LIVEKIT_VERSION }}
        run: |
          base="https://github.com/livekit/livekit/releases/download/v$LIVEKIT_VERSION"
          asset="livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          grep " $asset\$" checksums.txt | sha256sum -c -
          tar xzf "$asset" livekit-server
          ./livekit-server --version

      - name: Fetch the LiveKit CLI ${{ env.LK_CLI_VERSION }}
        run: |
          base="https://github.com/livekit/livekit-cli/releases/download/v$LK_CLI_VERSION"
          asset="lk_${LK_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o lk-checksums.txt "$base/checksums.txt"
          grep " $asset\$" lk-checksums.txt | sha256sum -c -
          tar xzf "$asset" lk
          sudo install -m 0755 lk /usr/local/bin/lk
          lk --version

      # Per-run credentials. OwnCord blanks the shipped dev key/secret at load
      # and disables voice entirely (config.go), so a run on those would
      # measure a server with no voice and report nothing about it.
      - name: Generate LiveKit credentials
        run: |
          key="lk$(openssl rand -hex 8)"
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          {
            echo "LIVEKIT_API_KEY=$key"
            echo "LIVEKIT_API_SECRET=$secret"
          } >>"$GITHUB_ENV"

      - name: Stage the run directory
        run: |
          work="$RUNNER_TEMP/loadtest"
          mkdir -p "$work"
          cp Server/chatserver livekit-server "$work/"
          echo "WORK=$work" >>"$GITHUB_ENV"

      # Everything below reads these instead of testing the profile again.
      # The scheme is the whole of the TLS dimension: `tls: off` sets the
      # server's tls.mode to off and flips both URLs, and nothing else in the
      # job changes — which is exactly what makes the difference between the
      # two operational legs a TLS delta and not a config delta.
      - name: Derive the profile's run parameters
        run: |
          if [ "$TLS_MODE" = "off" ]; then
            scheme=http
            ws_scheme=ws
          else
            scheme=https
            ws_scheme=wss
          fi

          # The ceiling search has to connect `CEILING_MAX` sockets for its top
          # step to be the connection count it claims, so it seeds for that
          # regardless of `users`. Every other profile seeds `users`.
          # Every k6 VU logs in as loadtest<its own test-wide id> (ws-load.js),
          # so the seed count is the VU count: the observer VU on top of the
          # sockets for the search, on operational the observer plus the
          # WebSocket cohort plus the uploads cohort, and on restart the
          # observer plus the WebSocket cohort — the observer VU is the
          # highest id in the pool and its account must exist, or the
          # nondeterministic allocation below strands a WebSocket VU on a
          # login that cannot succeed (Codex P2 on #1629). With the BPR-030
          # defaults (250 users, 100 connections) `users` already covers all
          # of these; a smaller `users` is what would break them.
          # scale's login burst logs K fresh users in, one per login-burst VU,
          # and those VUs share the id pool with the cohort and the observer.
          scale_logins=500
          if [ "$PROFILE" = "ceiling-search" ]; then
            seed_users=$((CEILING_MAX + 1))
          elif [ "$PROFILE" = "scale" ]; then
            seed_users=$((CONNECTIONS + 1 + scale_logins))
          elif [ "$PROFILE" = "operational" ] && [ "$SEED_USERS_INPUT" -lt $((2 * CONNECTIONS + 1)) ]; then
            seed_users=$((2 * CONNECTIONS + 1))
          elif [ "$PROFILE" = "restart" ] && [ "$SEED_USERS_INPUT" -lt $((CONNECTIONS + 1)) ]; then
            seed_users=$((CONNECTIONS + 1))
          else
            seed_users="$SEED_USERS_INPUT"
          fi

          # Only capacity and operational have a voice leg. restart and
          # ceiling-search measure the connection path; leaving the channel
          # unset makes ws-load.js set K6_VOICE_VUS to 0 and drop every voice
          # threshold, so a disabled leg neither fails nor passes vacuously.
          case "$PROFILE" in
          capacity | operational) voice_leg=1 ;;
          *)
            voice_leg=0
            ;;
          esac

          # The restart drill stops the server mid-sustain. The stop is
          # PLACED, not guessed (OC-0446): the drill compares a window before
          # the stop against a window after it, and that comparison is only
          # meaningful if both hold the same population for the same length.
          # The run is ramp + sustain; the steady-before window is
          # restart_at - ramp and the steady-after window is
          # run - restart_at - recovery, so equalizing them gives the midpoint
          # below. The old value (60 + 30 = 90) left 30 s of full fan-out
          # before the stop against ~186 s after it, which is the imbalance
          # that made the published post-restart p95 unattributable.
          # ws-load.js derives the same boundaries and takes this one as an
          # override, so the tagger and the drill cannot disagree.
          ramp_s=60
          sustain_s=180
          recovery_s=30
          restart_at=$(((2 * ramp_s + sustain_s - recovery_s) / 2))

          # OC-0447: at the default 2 s send interval, each VU can send
          # once in a sliding 1 s window even if every timer aligns. Budget
          # at most 50 of the server's 100 topic messages/s, including the
          # observer's arbitrary slot in the VU-id pool. ws-load.js validates
          # this again (and requires more channels for faster custom sends).
          ceiling_channels=$(((CEILING_MAX + 1 + 49) / 50))
          # An `[ ] && assign` here would abort the step: GitHub runs this
          # shell with -e, and a false test leaves the whole AND-list at
          # status 1.
          if [ "$ceiling_channels" -lt 1 ]; then
            ceiling_channels=1
          fi

          # scale: 20 channels, about 100 members each at 2,000. ws-load.js
          # refuses at init a mix that would put more than half the topic
          # limit on one channel (OC-0447), so a faster burst is one message
          # away from its fix rather than a silent limiter measurement.
          case "$PROFILE" in
          ceiling-search) text_channels=$ceiling_channels ;;
          scale) text_channels=20 ;;
          *) text_channels=1 ;;
          esac

          {
            echo "HTTP_BASE=$scheme://127.0.0.1:8443"
            echo "SUT_WS_URL=$ws_scheme://127.0.0.1:8443/api/v1/ws"
            echo "SUT_HTTP_URL=$scheme://127.0.0.1:8443"
            echo "SEED_USERS=$seed_users"
            echo "VOICE_LEG=$voice_leg"
            echo "RESTART_AT=$restart_at"
            echo "RESTART_RECOVERY_S=$recovery_s"
            echo "CEILING_CHANNELS=$ceiling_channels"
            echo "TEXT_CHANNELS=$text_channels"
            echo "SCALE_LOGINS=$scale_logins"
          } >>"$GITHUB_ENV"

      # --- boot, one step per leg -------------------------------------------
      #
      # Registration/login are per-IP rate limited and every connection comes
      # from 127.0.0.1 — scale the auth limits with the knob that exists for
      # shared-IP scenarios. voice.livekit_binary points at the mounted SFU, so
      # the server runs it as its companion process exactly as an owner's would,
      # from OwnCord's OWN generated livekit.yaml rather than a hand-written one.
      #
      # advertise_internal_ip is what makes that generated config usable by a
      # load client on the same machine: the template sets
      # `use_external_ip: true`, so on its own LiveKit advertises only the
      # runner's STUN-discovered public address, which no local peer can reach
      # — the room connects and carries no media, the "voice works but nobody
      # hears anything" failure. advertise_internal_ip keeps the host
      # candidates alongside it. Verified 2026-09-12: `lk load-test` gets 25/25
      # tracks at 0% loss against this generated config (then also carrying a
      # node_ip=127.0.0.1 that use_external_ip overrode, now dropped).
      - name: Boot server (constrained — 2 CPUs, 4 GB, no swap)
        if: matrix.leg == 'constrained'
        run: |
          # The per-profile server environment. Everything above this line is
          # B6-9's recipe and does not move: the profile changes these three
          # flags and nothing else about the boot.
          extra_env=()
          case "$PROFILE" in
          operational)
            # 1 MB is the value that makes the 507 quota-refuse path reachable
            # inside the 10/min upload limit. It is a way to cross the bound,
            # not a recommended quota.
            extra_env+=(-e OWNCORD_UPLOAD_USER_QUOTA_MB=1)
            ;;
          ceiling-search)
            # Twice the probe maximum, so a config cap can never be the
            # "ceiling" the search reports. The run asserts ws_conn_rejects
            # stayed 0, which is what makes that claim checkable.
            extra_env+=(-e "OWNCORD_SERVER_MAX_WS_CONNECTIONS=$((CEILING_MAX * 2))")
            ;;
          scale)
            # The generator's X-Forwarded-For is trusted from loopback only,
            # so every seeded user and VU is its own address to the per-IP
            # limits. A measurement setting: it is not a deployment
            # recommendation. The connection cap is twice the population, as
            # for the search, so ws_conn_rejects == 0 is a checkable claim.
            extra_env+=(-e OWNCORD_SERVER_TRUSTED_PROXIES=127.0.0.1/32)
            extra_env+=(-e "OWNCORD_SERVER_MAX_WS_CONNECTIONS=$((CONNECTIONS * 2))")
            ;;
          esac
          if [ "$TLS_MODE" = "off" ]; then
            extra_env+=(-e OWNCORD_TLS_MODE=off)
          fi

          # Removed first so a re-run on the same runner is idempotent, and so
          # the restart drill's `docker start` finds the container it stopped.
          docker rm -f owncord-sut >/dev/null 2>&1 || true
          docker run -d --name owncord-sut \
            --network=host \
            --cpuset-cpus=0,1 --cpus=2 \
            --memory=4g --memory-swap=4g \
            -v "$WORK:/app" -w /app \
            -e OWNCORD_SECURITY_AUTH_RATE_LIMIT_MULTIPLIER=100 \
            -e OWNCORD_VOICE_LIVEKIT_API_KEY="$LIVEKIT_API_KEY" \
            -e OWNCORD_VOICE_LIVEKIT_API_SECRET="$LIVEKIT_API_SECRET" \
            -e OWNCORD_VOICE_LIVEKIT_URL=ws://127.0.0.1:7880 \
            -e OWNCORD_VOICE_LIVEKIT_BINARY=/app/livekit-server \
            -e OWNCORD_VOICE_ADVERTISE_INTERNAL_IP=true \
            "${extra_env[@]}" \
            debian:bookworm-slim /app/chatserver
          for _ in $(seq 1 90); do
            if docker exec owncord-sut /app/chatserver healthcheck >/dev/null 2>&1; then
              echo "healthy"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' owncord-sut)" != "true" ]; then
              echo "::error::container exited before reporting healthy"
              docker logs owncord-sut
              exit 1
            fi
            sleep 1
          done
          echo "::error::server never became healthy inside the cgroup"
          docker logs owncord-sut
          exit 1

      - name: Boot server (ceiling — the whole runner, informational)
        if: matrix.leg == 'ceiling'
        run: |
          cd "$WORK"
          OWNCORD_SECURITY_AUTH_RATE_LIMIT_MULTIPLIER=100 \
          OWNCORD_VOICE_LIVEKIT_API_KEY="$LIVEKIT_API_KEY" \
          OWNCORD_VOICE_LIVEKIT_API_SECRET="$LIVEKIT_API_SECRET" \
          OWNCORD_VOICE_LIVEKIT_URL=ws://127.0.0.1:7880 \
          OWNCORD_VOICE_LIVEKIT_BINARY="$WORK/livekit-server" \
          OWNCORD_VOICE_ADVERTISE_INTERNAL_IP=true \
            ./chatserver > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 90); do
            sleep 1
            if ./chatserver healthcheck; then exit 0; fi
          done
          echo "::error::server never became healthy"
          tail -50 server.log
          exit 1

      # What the server actually believes about its hardware. Recorded from
      # INSIDE the cgroup, because a leg that is quietly unconstrained is
      # indistinguishable from a constrained one in the numbers alone.
      - name: Record the machine the numbers came from
        run: |
          {
            echo "profile: $PROFILE"
            echo "tls_mode: $TLS_MODE"
            echo "leg: ${MATRIX_LEG}"
            echo "host_nproc: $(nproc)"
            echo "host_mem_kb: $(awk '/MemTotal/{print $2}' /proc/meminfo)"
            if [ "${MATRIX_LEG}" = "constrained" ]; then
              echo "container_nproc: $(docker exec owncord-sut nproc)"
              echo "container_cpu_max: $(docker exec owncord-sut cat /sys/fs/cgroup/cpu.max)"
              echo "container_cpuset: $(docker exec owncord-sut cat /sys/fs/cgroup/cpuset.cpus.effective)"
              echo "container_mem_max: $(docker exec owncord-sut cat /sys/fs/cgroup/memory.max)"
              echo "container_swap_max: $(docker exec owncord-sut cat /sys/fs/cgroup/memory.swap.max)"
            fi
            echo "livekit_server: $LIVEKIT_VERSION"
            echo "lk_cli: $LK_CLI_VERSION"
          } | tee "$WORK/limits.txt"
        env:
          MATRIX_LEG: ${{ matrix.leg }}

      # Seeding is not measured; it only has to produce the population the
      # profile describes. No registration-mode change: a fresh install is
      # `invite` mode (docs/api.md), so the invite below admits every
      # registration. The old PATCH {"registration_open":"true"} predates
      # B4-1's registration_mode and now returns 400.
      - name: Seed owner, channels, invite and ${{ env.SEED_USERS }} users
        run: |
          BASE="$HTTP_BASE"
          # The one-time setup token the server printed at start-up.
          if [ "${MATRIX_LEG}" = "constrained" ]; then
            SERVER_LOG=$(docker logs owncord-sut 2>&1)
          else
            SERVER_LOG=$(cat "$WORK/server.log")
          fi
          SETUP_TOKEN=$(printf '%s\n' "$SERVER_LOG" | sed -n 's/.*Setup token[[:space:]]*//p' | tail -n 1)
          TOKEN=$(curl -sk -X POST "$BASE/admin/api/setup" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg t "$SETUP_TOKEN" '{username:"loadadmin",password:"LoadTest123!Admin",setup_token:$t}')" | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::setup failed"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          CHANNEL_ID=$(curl -sk -X POST "$BASE/admin/api/channels" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"loadtest","type":"text"}' | jq -r .id)
          VOICE_ID=$(curl -sk -X POST "$BASE/admin/api/channels" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"loadvoice","type":"voice"}' | jq -r .id)
          if [ -z "$CHANNEL_ID" ] || [ "$CHANNEL_ID" = "null" ]; then
            echo "::error::text channel create failed"
            exit 1
          fi
          if [ -z "$VOICE_ID" ] || [ "$VOICE_ID" = "null" ]; then
            echo "::error::voice channel create failed"
            exit 1
          fi
          echo "CHANNEL_ID=$CHANNEL_ID" >>"$GITHUB_ENV"
          echo "VOICE_ID=$VOICE_ID" >>"$GITHUB_ENV"

          # The ceiling search's and the scale profile's cohorts are spread
          # over TEXT_CHANNELS text channels (OC-0447); the one above is the
          # first of them, and every other profile keeps using it alone. The
          # ids go to k6 as a comma-separated list, and a connection picks one
          # by its own VU slot, so a cohort divides evenly between them.
          TEXT_CHANNEL_IDS="$CHANNEL_ID"
          for i in $(seq 2 "$TEXT_CHANNELS"); do
            cid=$(curl -sk -X POST "$BASE/admin/api/channels" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"loadtest-$i\",\"type\":\"text\"}" | jq -r .id)
            if [ -z "$cid" ] || [ "$cid" = "null" ]; then
              echo "::error::text channel $i create failed"
              exit 1
            fi
            TEXT_CHANNEL_IDS="$TEXT_CHANNEL_IDS,$cid"
          done
          echo "TEXT_CHANNEL_IDS=$TEXT_CHANNEL_IDS" >>"$GITHUB_ENV"

          INVITE=$(curl -sk -X POST "$BASE/api/v1/invites" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"max_uses":0}' | jq -r .code)
          if [ -z "$INVITE" ] || [ "$INVITE" = "null" ]; then
            echo "::error::invite create failed"
            exit 1
          fi

          USERS="$SEED_USERS"
          if [ "$PROFILE" = "scale" ]; then
            # User n registers from the address VU n later uses (ws-load.js
            # scaleAddress), and the session token its registration returns
            # is kept: tokens.txt holds one per line in user order, so a VU
            # starts from its token as a returning desktop client does and the
            # measured windows hold no bcrypt but the login burst's. As many in
            # flight as the server's bcrypt admission budget (2 x NumCPU); a
            # refusal from it is retried, anything else fails the seeding.
            # tokens.txt stays in the run directory and is never uploaded.
            # Both run inside xargs' `bash -c`, which shellcheck cannot follow.
            # shellcheck disable=SC2317
            scale_address() { echo "10.$((($1 >> 16) & 255)).$((($1 >> 8) & 255)).$(($1 & 255))"; }
            # shellcheck disable=SC2317
            register_one() {
              local i=$1 out code
              for _ in 1 2 3 4 5; do
                out=$(curl -sk -w '\n%{http_code}' -X POST "$BASE/api/v1/auth/register" \
                  -H 'Content-Type: application/json' -H "X-Forwarded-For: $(scale_address "$i")" \
                  -d "{\"username\":\"loadtest$i\",\"password\":\"LoadTest123!\",\"invite_code\":\"$INVITE\"}")
                code=${out##*$'\n'}
                [ "$code" = 429 ] || break
                sleep 1
              done
              case "$code" in
              200 | 201) printf '%s %s\n' "$i" "$(printf '%s' "${out%$'\n'*}" | jq -r .token)" ;;
              *)
                echo "::error::registering loadtest$i failed with $code" >&2
                exit 255
                ;;
              esac
            }
            export -f scale_address register_one
            export BASE INVITE
            parallel=$((2 * $(docker exec owncord-sut nproc)))
            echo "registering $USERS users, $parallel in flight"
            # shellcheck disable=SC2016 # $1 is the inner shell's argument
            seq 1 "$USERS" | xargs -P "$parallel" -n 1 bash -c 'register_one "$1"' _ >"$WORK/tokens.unsorted"
            # In user order, one per line, and every line a token for its user.
            sort -n -k1,1 "$WORK/tokens.unsorted" |
              awk 'NR != $1 || $2 == "" || $2 == "null" { bad = 1 } { print $2 } END { exit bad }' >"$WORK/tokens.txt"
            rm -f "${WORK:?}/tokens.unsorted"
            echo "registered $USERS users and kept $(wc -l <"$WORK/tokens.txt") session tokens"
            exit 0
          fi
          for i in $(seq 1 "${USERS:-250}"); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST "$BASE/api/v1/auth/register" \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"loadtest$i\",\"password\":\"LoadTest123!\",\"invite_code\":\"$INVITE\"}")
            case "$code" in
            200 | 201) ;;
            *)
              echo "::error::registering loadtest$i failed with $code"
              exit 1
              ;;
            esac
            if [ $((i % 50)) -eq 0 ]; then echo "registered $i/${USERS:-250}"; fi
          done
        env:
          MATRIX_LEG: ${{ matrix.leg }}

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6

      # Per profile. The capacity profile (both legs) runs the lk SFU cohort
      # alongside k6, because its claim is 100 connections AND 25 voice
      # participants on one server at once — measuring them in turn would
      # publish two numbers no single run ever held together. The other
      # profiles have no lk cohort: the operational churn exercises the control
      # plane, and restart/ceiling-search measure the connection path.
      #
      # The restart drill's stop has to fire WHILE k6 holds sockets, so the
      # workflow, not k6, sends it: a background subshell sleeps to RESTART_AT
      # (60 s ramp + 30 s of sustain), stops the container, records the drain
      # wall clock and the server's own exit code, then `docker start`s the
      # SAME container — same cgroup, same flags, same data dir, and no second
      # `docker run` text to drift from the line docs/capacity.md publishes.
      #
      # taskset keeps the generators on CPUs 2-3, off the server's cpuset.
      - name: Run the ${{ env.PROFILE }} profile
        id: profile
        env:
          K6_PROFILE: ${{ env.PROFILE }}
          K6_WS_URL: ${{ env.SUT_WS_URL }}
          K6_HTTP_URL: ${{ env.SUT_HTTP_URL }}
          K6_CHANNEL_ID: ${{ env.CHANNEL_ID }}
          # Empty on the profiles with no voice leg. ws-load.js then sets
          # K6_VOICE_VUS to 0 and registers no voice threshold, so a disabled
          # leg neither fails nor passes vacuously.
          K6_VOICE_CHANNEL_ID: ${{ env.VOICE_LEG == '1' && env.VOICE_ID || '' }}
          K6_VOICE_VUS: ${{ env.VOICE }}
          K6_VOICE_CHURN_PHASE: ${{ inputs.churn_phase || 'spread' }}
          K6_PEAK_VUS: ${{ env.CONNECTIONS }}
          K6_RAMP: 60s
          K6_SUSTAIN: 180s
          K6_CEILING_MAX: ${{ env.CEILING_MAX }}
          K6_CEILING_CHANNELS: ${{ env.TEXT_CHANNEL_IDS }}
          K6_SCALE_CHANNELS: ${{ env.TEXT_CHANNEL_IDS }}
          K6_SCALE_TOKENS: ${{ env.WORK }}/tokens.txt
          K6_SCALE_ACTIVE: ${{ env.SCALE_ACTIVE }}
          K6_SCALE_BURST_SEND_MS: ${{ env.SCALE_BURST_SEND_MS }}
          K6_SCALE_HERD_SPREAD_S: ${{ env.SCALE_HERD_SPREAD_S }}
          K6_SCALE_LOGINS: ${{ env.SCALE_LOGINS }}
          K6_RESTART_AT: ${{ env.RESTART_AT }}
          K6_RESTART_RECOVERY_S: ${{ env.RESTART_RECOVERY_S }}
          MATRIX_LEG: ${{ matrix.leg }}
        run: |
          mkdir -p Server/scripts/k6/reports

          # cgroup + generator evidence, one sample every 5 s with a wall-clock
          # stamp, so the document can slice it by phase (operational, restart,
          # scale) or by step (ceiling-search). loadavg is the HOST's and is
          # where k6 itself runs; k6_ticks is k6's own CPU (utime + stime, in
          # CLK_TCK ticks), so a window where the generator saturates its two
          # CPUs before the server's cgroup is throttled is marked
          # generator-limited and published as such, never as a server ceiling.
          #
          # The loop watches a flag rather than the container, so the restart
          # drill's outage window is sampled too.
          (
            while [ ! -f "$WORK/.sampling-done" ]; do
              printf '%s loadavg=%s %s k6_ticks=%s\n' \
                "$(date -u +%s)" \
                "$(cut -d' ' -f1-3 /proc/loadavg)" \
                "$(docker exec owncord-sut cat /sys/fs/cgroup/cpu.stat 2>/dev/null | tr '\n' ' ' || true)" \
                "$(awk '{ print $14 + $15 }' "/proc/$(cat "$WORK/k6.pid" 2>/dev/null)/stat" 2>/dev/null || true)"
              sleep 5
            done
          ) >"$WORK/cpu.stat.log" 2>&1 &
          sample_pid=$!

          # The lk cohort is capacity's alone; VOICE_LEG also covers the
          # operational k6 voice churn, which is why it is not the gate here.
          voice_pid=""
          if [ "$PROFILE" = "capacity" ]; then
            PUBLISHERS="${VOICE}" SUBSCRIBERS="${VOICE}" \
            DURATION=260s LIVEKIT_VERSION="$LIVEKIT_VERSION" \
            LIVEKIT_URL=http://127.0.0.1:7880 \
            REPORT="$WORK/voice-load.txt" \
              taskset -c 2,3 bash Server/scripts/voice-load.sh &
            voice_pid=$!
          fi

          drill_pid=""
          if [ "$PROFILE" = "restart" ]; then
            (
              sleep "$RESTART_AT"
              start=$(date +%s%N)
              # Grace well past the 30 s drill gate and the server's 50 s
              # teardownBudget, so an over-budget drain is measured by the
              # assertion below rather than cut short by docker's SIGKILL.
              docker stop --time=90 owncord-sut
              rc=$(docker wait owncord-sut)
              drain_ms=$((($(date +%s%N) - start) / 1000000))
              {
                echo "drill_rc=$rc"
                echo "drill_drain_ms=$drain_ms"
              } >"$WORK/drain.txt"
              echo "restart drill: server exited $rc after ${drain_ms} ms of drain"
              docker start owncord-sut >/dev/null
              for _ in $(seq 1 90); do
                if docker exec owncord-sut /app/chatserver healthcheck >/dev/null 2>&1; then
                  echo "restart drill: back up and healthy"
                  exit 0
                fi
                sleep 1
              done
              echo "::error::the server never came back healthy after the restart"
              exit 1
            ) &
            drill_pid=$!
          fi

          k6_rc=0
          # exec, so the background job's pid IS k6's and the sampler can read
          # its CPU from /proc.
          (cd Server/scripts/k6 && exec taskset -c 2,3 k6 run --insecure-skip-tls-verify ws-load.js) &
          k6_pid=$!
          echo "$k6_pid" >"$WORK/k6.pid"
          wait "$k6_pid" || k6_rc=$?
          cp Server/scripts/k6/reports/k6-summary.json "$WORK/" 2>/dev/null || true

          touch "$WORK/.sampling-done"
          wait "$sample_pid" || true

          voice_rc=0
          if [ -n "$voice_pid" ]; then
            wait "$voice_pid" || voice_rc=$?
          fi

          echo "k6_rc=$k6_rc voice_rc=$voice_rc"
          if [ "${MATRIX_LEG}" != "constrained" ]; then
            # The ceiling leg is informational: a breach here says "the big box
            # is also busy", which is context, not a capacity result.
            echo "::notice::ceiling leg finished with k6=$k6_rc voice=$voice_rc (not gating)"
            exit 0
          fi

          if [ -n "$drill_pid" ]; then
            # A failing wait aborts the step here (the subshell has already
            # said why), and drain.txt is written before the reboot is
            # attempted, so the drain figure survives a failed reboot.
            wait "$drill_pid"
            # shellcheck source=/dev/null
            . "$WORK/drain.txt"
            if [ "$drill_rc" -ne 0 ]; then
              echo "::error::the server exited $drill_rc on a graceful stop under load. That is a defect, not a number: open a findings-ledger entry, do NOT re-run this on a bigger box."
              exit 1
            fi
            if [ "$drill_drain_ms" -gt 30000 ]; then
              echo "::error::the drain took ${drill_drain_ms} ms, over the drill's 30 s gate (deliberately stricter than the server's 50 s teardownBudget cap). Publish the measured number and open a findings-ledger entry; do NOT re-run this on a bigger box."
              exit 1
            fi
            echo "drain $drill_drain_ms ms, exit $drill_rc — inside the 30 s drill gate"
          fi

          if [ "$voice_rc" -ne 0 ]; then
            echo "::error::the 25-participant voice leg did not meet its assertions — see the voice-load report"
            exit 1
          fi
          if [ "$k6_rc" -eq 99 ]; then
            echo "::error::a threshold was missed on the constrained leg — a latency budget, or one of the count / max==0 sanity gates. Publish the measured number and open a findings-ledger entry; do NOT re-run this on a bigger box."
            exit 1
          fi
          exit "$k6_rc"

      - name: Snapshot server metrics
        if: always()
        run: |
          curl -sk "$HTTP_BASE/api/v1/metrics" | tee "$WORK/metrics-after.json" || true

      - name: Stop server
        if: always()
        run: |
          if [ "${MATRIX_LEG}" = "constrained" ]; then
            docker logs owncord-sut >"$WORK/server.log" 2>&1 || true
            docker stop -t 20 owncord-sut || true
            docker rm -f owncord-sut || true
          else
            kill "$(cat "$WORK/server.pid")" 2>/dev/null || true
            sleep 3
          fi
        env:
          MATRIX_LEG: ${{ matrix.leg }}

      # A cap in the code must never be published as the hardware ceiling
      # (OC-0447). The search now spreads its cohort over enough channels to
      # stay under topicRateLimitPerSecond, so ANY shed frame on this leg means
      # the shaping is wrong and the steps at and above it measured the limiter
      # rather than the machine -- they are inconclusive, not a ceiling. Same
      # posture as the run's own obs_ws_conn_rejects == 0, which makes the
      # same claim about the connection cap.
      #
      # Read the counter from metrics-after.json (SRE-M1), not the server log:
      # the JSON figure is the same number the Attention panel alerts on, so
      # the gate can no longer drift from what an operator sees. A missing or
      # unreadable snapshot fails the gate rather than passing it.
      #
      # The scale profile is shaped the same way and gated the same way: a shed
      # frame means a window measured the limiter (OC-0447).
      - name: Assert the run never hit the topic limiter
        if: always() && (env.PROFILE == 'ceiling-search' || env.PROFILE == 'scale') && matrix.leg == 'constrained'
        run: |
          if ! shed=$(jq -er '.topic_sheds_total' "$WORK/metrics-after.json" 2>/dev/null); then
            echo "::error::metrics-after.json is missing or has no topic_sheds_total, so topic-limiter shedding cannot be checked"
            exit 1
          fi
          if [ "$shed" != "0" ]; then
            echo "::error::$shed frame(s) were shed by topicRateLimitPerSecond. The $PROFILE profile is shaped to stay under it (TEXT_CHANNELS=$TEXT_CHANNELS), so this means the shaping is wrong: the steps or windows from the first shed on are INCONCLUSIVE, not a server ceiling. Widen the channel list and re-run; do NOT publish them as the hardware ceiling."
            exit 1
          fi
          echo "no topic-limiter shedding: every step or window was limited by the server, not by the limiter"

      # scale: the server's and the generator's CPU per window, from the 5 s
      # samples, anchored on the run start k6 wrote into its summary. A window
      # whose k6 averaged 90% or more of its two CPUs is GENERATOR-LIMITED: its
      # numbers say what the generator could offer, not what the server can
      # carry, and they are published as such. If the steady window is, the
      # runner question (a larger runner or a lighter driver) is the owner's
      # call, decision D6, and docs/capacity.md says so.
      - name: Slice server and generator CPU by window
        if: always() && env.PROFILE == 'scale'
        run: |
          summary="$WORK/k6-summary.json"
          if ! start_ms=$(jq -er '.load_measurement.run_start_epoch_ms' "$summary" 2>/dev/null); then
            echo "::warning::no k6 summary, so CPU cannot be sliced by window"
            exit 0
          fi
          jq -r '.load_measurement.windows[] | "\(.phase) \(.start_s) \(.end_s // 1000000000)"' "$summary" >"$WORK/windows.txt"
          # Each 5 s interval is booked to the window its end falls in.
          awk -v start_ms="$start_ms" -v hz="$(getconf CLK_TCK)" -v cores=2 '
            FNR == NR { name[++n] = $1; from[n] = $2; to[n] = $3; next }
            {
              t = $1 - start_ms / 1000; usage = ""; ticks = ""
              for (i = 2; i <= NF; i++) {
                if ($i == "usage_usec") usage = $(i + 1)
                if ($i ~ /^k6_ticks=[0-9]+$/) ticks = substr($i, 10)
              }
              if (prev_t != "" && t > prev_t) {
                dt = t - prev_t
                for (p = 1; p <= n; p++) {
                  if (t <= from[p] || t > to[p]) continue
                  if (usage != "" && prev_u != "") {
                    c = (usage - prev_u) / 1e6 / dt; ssum[p] += c; sn[p]++
                    if (c > speak[p]) speak[p] = c
                  }
                  if (ticks != "" && prev_k != "") {
                    c = (ticks - prev_k) / hz / dt; gsum[p] += c; gn[p]++
                    if (c > gpeak[p]) gpeak[p] = c
                  }
                }
              }
              prev_t = t; prev_u = usage; prev_k = ticks
            }
            END {
              printf "%-10s %-22s %-22s\n", "window", "server avg/peak of 2", "k6 avg/peak of " cores
              for (p = 1; p <= n; p++) {
                s = sn[p] ? sprintf("%.2f / %.2f", ssum[p] / sn[p], speak[p]) : "-"
                g = gn[p] ? sprintf("%.2f / %.2f", gsum[p] / gn[p], gpeak[p]) : "-"
                mark = gn[p] && gsum[p] / gn[p] >= 0.9 * cores ? "  GENERATOR-LIMITED" : ""
                printf "%-10s %-22s %-22s%s\n", name[p], s, g, mark
              }
            }
          ' "$WORK/windows.txt" "$WORK/cpu.stat.log" | tee "$WORK/windows-cpu.txt"
          if grep -q GENERATOR-LIMITED "$WORK/windows-cpu.txt"; then
            echo "::warning::at least one window is generator-limited: publish it as such, not as a server result (docs/capacity.md, Scale profile)"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # capacity keeps B6-9's exact artifact name, so the published runs
          # stay findable; the other profiles name themselves.
          name: ${{ env.PROFILE == 'capacity' && format('capacity-{0}', matrix.leg) || format('capacity-{0}-{1}{2}', env.PROFILE, matrix.leg, matrix.tls == 'off' && '-off' || '') }}
          path: |
            ${{ runner.temp }}/loadtest/k6-summary.json
            ${{ runner.temp }}/loadtest/voice-load.txt
            ${{ runner.temp }}/loadtest/limits.txt
            ${{ runner.temp }}/loadtest/metrics-after.json
            ${{ runner.temp }}/loadtest/server.log
            ${{ runner.temp }}/loadtest/cpu.stat.log
            ${{ runner.temp }}/loadtest/drain.txt
            ${{ runner.temp }}/loadtest/windows-cpu.txt
          retention-days: 30
