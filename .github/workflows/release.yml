name: Release

on:
  push:
    tags:
      - "v*"

# A deleted-and-re-pushed tag (it has happened — see the checksum note in the
# publish job) must not race two publish runs: `gh release create` fails
# loudly on the second run, but the ghcr :latest push does not, and which run
# wins it would be arbitrary. Queue, never cancel — a half-cancelled release
# is worse than a slow one.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Least privilege by default. Without this, every job below inherits whatever
# the repository's default GITHUB_TOKEN permissions are; each job then names
# the scopes it actually uses. zizmor's excessive-permissions audit is the
# check that keeps this honest.
permissions: {}

jobs:
  # R-09 / RL-16. ci.yml has no `tags:` trigger, so a tag push starts this
  # workflow and nothing else — and this workflow re-runs none of the required
  # checks. It builds, smokes and signs, which is a different question from
  # "did the gate pass on this commit".
  #
  # It did not, at least once: v1.2.0-alpha.3 published from a commit whose
  # `Server Build & Test (windows-latest)` had concluded failure. Nothing
  # noticed, because nothing looked.
  #
  # The required set is read out of b0-dev-branch-protection.sh rather than
  # restated here, so pinning a new check cannot leave this gate behind. The
  # logic lives in a script with a --selftest that ci.yml runs on every PR:
  # a step that exists only in this file first executes at tag time, which is
  # the wrong place to discover its bugs.
  gate-evidence:
    name: Verify exact-SHA gate evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # zizmor cache-poisoning, as in the build jobs below: no cache is
          # restored in a workflow that can publish a runtime artifact.
          package-manager-cache: false
      - name: Required checks must be green on the tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-gate-evidence.mjs "${{ github.sha }}"

  # The v1.1.0-alpha.4 release shipped clients still versioned 1.1.0-alpha.3
  # because the client manifests weren't bumped before tagging — deployed
  # clients then never saw the update. Fail fast on that mismatch, before any
  # expensive build starts.
  verify-versions:
    name: Verify client version matches tag
    # Every build job needs verify-versions, and both publishers need those, so
    # one edge here gates the whole graph — nothing builds, pushes to GHCR, or
    # creates a Release on a commit that did not pass.
    needs: gate-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compare tag with client manifests
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAURI_VERSION=$(node -p "require('./Client/src-tauri/tauri.conf.json').version")
          NPM_VERSION=$(node -p "require('./Client/package.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Client/src-tauri/Cargo.toml | head -1)
          fail=0
          for pair in "tauri.conf.json:$TAURI_VERSION" "package.json:$NPM_VERSION" "Cargo.toml:$CARGO_VERSION"; do
            file="${pair%%:*}"; ver="${pair#*:}"
            if [ "$ver" != "$TAG_VERSION" ]; then
              echo "::error::Release tag v$TAG_VERSION does not match client version $ver in $file — bump the client version before tagging."
              fail=1
            fi
          done
          exit $fail

  release-client-windows:
    name: Build Tauri (Windows)
    needs: verify-versions
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # zizmor cache-poisoning. This workflow publishes runtime artifacts and
          # is tag-triggered, so it must not restore a cache an attacker could
          # poison. Removing `cache: npm` is what stops the restore on today's
          # v4 pin; `package-manager-cache: false` is zizmor's documented input
          # and becomes load-bearing if setup-node is ever bumped to v5, where
          # caching is on by default.
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Client/src-tauri
          lookup-only: true

      - name: Install npm dependencies
        working-directory: Client
        run: npm ci

      - name: Build Tauri app
        working-directory: Client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Stage Windows release assets
        shell: bash
        run: |
          mkdir -p release-staging
          NSIS_DIR="Client/src-tauri/target/release/bundle/nsis"
          INSTALLER=$(find "$NSIS_DIR" -name "*.exe" | head -1)
          cp "$INSTALLER" release-staging/
          NSIS_ZIP=$(find "$NSIS_DIR" -name "*_x64-setup.nsis.zip" ! -name "*.sig" | head -1)
          if [ -n "$NSIS_ZIP" ] && [ -f "$NSIS_ZIP" ]; then cp "$NSIS_ZIP" release-staging/; fi
          NSIS_SIG=$(find "$NSIS_DIR" -name "*_x64-setup.nsis.zip.sig" | head -1)
          if [ -n "$NSIS_SIG" ] && [ -f "$NSIS_SIG" ]; then cp "$NSIS_SIG" release-staging/; fi

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-assets
          path: release-staging/

  release-client-linux:
    name: Build Tauri (Linux)
    needs: verify-versions
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # zizmor cache-poisoning. This workflow publishes runtime artifacts and
          # is tag-triggered, so it must not restore a cache an attacker could
          # poison. Removing `cache: npm` is what stops the restore on today's
          # v4 pin; `package-manager-cache: false` is zizmor's documented input
          # and becomes load-bearing if setup-node is ever bumped to v5, where
          # caching is on by default.
          package-manager-cache: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            libasound2-dev \
            libssl-dev \
            patchelf \
            librsvg2-dev \
            xdg-utils

      # clang >= 21 plus the prebuilt libwebrtc the Linux client links against
      # (livekit -> webrtc-sys). Deliberately NO actions/cache restore here:
      # this workflow publishes runtime artifacts and is tag-triggered, so a
      # poisoned cache is exactly the risk zizmor's cache-poisoning audit names
      # (#1656). The installer downloads libwebrtc and verifies its pinned
      # sha256 instead, so a clean runner pays the ~148 MB and nothing can seed
      # it. clang-21 comes from apt.llvm.org's GPG-signed llvm-toolchain channel
      # (signing key pinned by fingerprint, not a pinned compiler build); the
      # exact version installed is printed in the log.
      - name: Install native-voice build prerequisites
        run: bash Client/scripts/linux-webrtc-toolchain.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Client/src-tauri
          lookup-only: true

      - name: Install npm dependencies
        working-directory: Client
        run: npm ci

      - name: Build Tauri app (AppImage + deb)
        working-directory: Client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles appimage,deb

      # Fail closed on the shipped binary's glibc floor: the prebuilt libwebrtc
      # this now links could raise it and nothing in the bundle declares one.
      # The same script is exercised on every PR by ci.yml's rust-tests
      # selftest and tauri-build's Linux legs, so it is not untested code
      # running first at tag time (the ci-check rule).
      - name: Check the binary's glibc floor
        working-directory: Client
        run: bash scripts/check-glibc-floor.sh src-tauri/target/release/owncord-client

      # linuxdeploy bundles the runner's libwayland-* into the AppImage, which
      # breaks Mesa EGL init on newer hosts (white window on Arch/Fedora —
      # EGL_BAD_PARAMETER). Strip them and regenerate the updater artifact +
      # signatures for the patched image.
      - name: Strip host-incompatible libs from AppImage and re-sign
        working-directory: Client
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE=$(find "$BUNDLE_DIR" -name "*.AppImage" ! -name "*.sig" | head -1)
          bash scripts/strip-appimage-bundled-libs.sh "$APPIMAGE"
          TARBALL="$APPIMAGE.tar.gz"
          rm -f "$TARBALL" "$APPIMAGE.sig" "$TARBALL.sig"
          tar czf "$TARBALL" -C "$(dirname "$APPIMAGE")" "$(basename "$APPIMAGE")"
          # Sign straight from the environment. TAURI_SIGNING_PRIVATE_KEY is
          # the env form of --private-key, so ALSO passing -f/--private-key-path
          # makes the CLI abort: "the argument '--private-key-path' cannot be
          # used with '--private-key'". Keeping the key in the env instead of a
          # temp file also keeps it off the runner's disk.
          npx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$APPIMAGE"
          npx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$TARBALL"

      - name: Stage Linux release assets
        shell: bash
        run: |
          mkdir -p linux-staging
          BUNDLE_DIR="Client/src-tauri/target/release/bundle"
          # AppImage
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" ! -name "*.sig" | head -1)
          if [ -n "$APPIMAGE" ] && [ -f "$APPIMAGE" ]; then cp "$APPIMAGE" linux-staging/; fi
          APPIMAGE_SIG=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage.sig" | head -1)
          if [ -n "$APPIMAGE_SIG" ] && [ -f "$APPIMAGE_SIG" ]; then cp "$APPIMAGE_SIG" linux-staging/; fi
          APPIMAGE_TAR=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage.tar.gz" ! -name "*.sig" | head -1)
          if [ -n "$APPIMAGE_TAR" ] && [ -f "$APPIMAGE_TAR" ]; then cp "$APPIMAGE_TAR" linux-staging/; fi
          APPIMAGE_TAR_SIG=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage.tar.gz.sig" | head -1)
          if [ -n "$APPIMAGE_TAR_SIG" ] && [ -f "$APPIMAGE_TAR_SIG" ]; then cp "$APPIMAGE_TAR_SIG" linux-staging/; fi
          # .deb
          DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" | head -1)
          if [ -n "$DEB" ] && [ -f "$DEB" ]; then cp "$DEB" linux-staging/; fi

      - name: Upload Linux release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-assets
          path: linux-staging/

  release-server:
    name: Build server (${{ matrix.asset }})
    needs: verify-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          # The amd64 asset names are frozen: servers deployed before arm64
          # existed match them exactly (Server/updater/updater.go), so renaming
          # either would strand every one of them on its current version.
          - os: windows-latest
            artifact: server-windows-amd64
            asset: chatserver.exe
          - os: windows-11-arm
            artifact: server-windows-arm64
            asset: chatserver-windows-arm64.exe
          - os: ubuntu-latest
            artifact: server-linux-amd64
            asset: chatserver-linux-amd64.tar.gz
          - os: ubuntu-22.04-arm
            artifact: server-linux-arm64
            asset: chatserver-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: false

      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Every row builds on its own architecture rather than cross-compiling,
      # because the smoke below has to EXECUTE the artifact that ships. A
      # cross-compiled asset could only be type-checked, which is the exact gap
      # B6-1 exists to close.
      - name: Build server (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: Server
        run: go build -o "${{ matrix.asset }}" -ldflags "-s -w -X main.version=$VERSION" .

      - name: Build server (Linux)
        if: runner.os == 'Linux'
        working-directory: Server
        env:
          CGO_ENABLED: "0"
        run: go build -o chatserver -ldflags "-s -w -X main.version=$VERSION" .

      # Smoke the EXACT artifact that ships: this feed drives the signed
      # self-update, so a binary that compiles but dies on boot would deploy
      # itself to every auto-updating instance. CI's tests exercise the same
      # commit but never this build (release ldflags, CGO_ENABLED=0) and never
      # execute the produced binary.
      #
      # cmd/smoke covers the whole owner-visible lifecycle, not only a boot:
      # cold boot writes config.yaml, generates a certificate and migrates a
      # fresh database; a graceful stop must then drain to a clean exit; a
      # restart on the SAME directory must come back healthy without rewriting
      # either. Shared with ci.yml so a regression is caught pre-merge.
      - name: Smoke server binary (boot, migrate, drain, restart)
        shell: bash
        working-directory: Server
        run: |
          BIN="./chatserver"
          [ -f "./${{ matrix.asset }}" ] && BIN="./${{ matrix.asset }}"
          go run ./cmd/smoke "$BIN"

      # Module inventory of the binary that just passed the smoke. Pinned the
      # way govulncheck is in ci.yml and checked by the Go checksum database,
      # so no scanner action or download is involved.
      #
      # `app` mode lists only the modules reachable from main, so the document
      # describes the shipped binary rather than the whole module graph.
      - name: Generate SBOM (CycloneDX, modules compiled into this binary)
        shell: bash
        working-directory: Server
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 app -json -main . -output "${{ matrix.asset }}.cdx.json"

      - name: Create tar.gz (Linux)
        if: runner.os == 'Linux'
        working-directory: Server
        run: tar czf "${{ matrix.asset }}" chatserver

      # Both paths in one upload list must share a parent. `upload-artifact`
      # takes the least common ancestor of the search paths as the artifact
      # root and strips exactly that prefix, so mixing a root-level path with a
      # `Server/` one keeps the `Server/` prefix *inside* the artifact: the file
      # arrives in the same artifact but not beside its asset, and the Linux leg
      # published at the root while its SBOM stayed under Server/. Both legs now
      # upload two `Server/` paths — the tar is written there for that reason,
      # not because anything downstream wants it at the repository root.
      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            Server/${{ matrix.asset }}
            Server/${{ matrix.asset }}.cdx.json

      - name: Upload Linux archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            Server/${{ matrix.asset }}
            Server/${{ matrix.asset }}.cdx.json

  release-client-linux-arm64:
    name: Build Tauri (Linux ARM64)
    needs: verify-versions
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # zizmor cache-poisoning. This workflow publishes runtime artifacts and
          # is tag-triggered, so it must not restore a cache an attacker could
          # poison. Removing `cache: npm` is what stops the restore on today's
          # v4 pin; `package-manager-cache: false` is zizmor's documented input
          # and becomes load-bearing if setup-node is ever bumped to v5, where
          # caching is on by default.
          package-manager-cache: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            libasound2-dev \
            libssl-dev \
            patchelf \
            librsvg2-dev \
            xdg-utils

      # Same prerequisite and same no-cache rule as the x86_64 job — see the
      # comment there: clang-21 from the same GPG-signed apt.llvm.org channel,
      # and the arm64 libwebrtc zip verified by its pinned sha256.
      - name: Install native-voice build prerequisites
        run: bash Client/scripts/linux-webrtc-toolchain.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Client/src-tauri
          lookup-only: true

      - name: Install npm dependencies
        working-directory: Client
        run: npm ci

      - name: Build Tauri app (AppImage + deb)
        working-directory: Client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles appimage,deb

      # Same floor check as the x86_64 job — the arm64 libwebrtc artifact
      # differs, so a floor it raises would not show up on x64.
      - name: Check the binary's glibc floor
        working-directory: Client
        run: bash scripts/check-glibc-floor.sh src-tauri/target/release/owncord-client

      # Same strip + re-sign as the x86_64 job — see the comment there.
      - name: Strip host-incompatible libs from AppImage and re-sign
        working-directory: Client
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE=$(find "$BUNDLE_DIR" -name "*.AppImage" ! -name "*.sig" | head -1)
          bash scripts/strip-appimage-bundled-libs.sh "$APPIMAGE"
          TARBALL="$APPIMAGE.tar.gz"
          rm -f "$TARBALL" "$APPIMAGE.sig" "$TARBALL.sig"
          tar czf "$TARBALL" -C "$(dirname "$APPIMAGE")" "$(basename "$APPIMAGE")"
          # Sign straight from the environment. TAURI_SIGNING_PRIVATE_KEY is
          # the env form of --private-key, so ALSO passing -f/--private-key-path
          # makes the CLI abort: "the argument '--private-key-path' cannot be
          # used with '--private-key'". Keeping the key in the env instead of a
          # temp file also keeps it off the runner's disk.
          npx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$APPIMAGE"
          npx tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$TARBALL"

      - name: Stage Linux ARM64 release assets
        shell: bash
        run: |
          mkdir -p linux-arm64-staging
          BUNDLE_DIR="Client/src-tauri/target/release/bundle"
          # AppImage + updater artifact (.tar.gz) + signatures. Every filename
          # must carry the arch: FindClientAssets matches on the
          # _aarch64.AppImage.tar.gz suffix, and arch-less names would collide
          # with the x86_64 assets when both artifact sets are downloaded into
          # the same linux/ directory at publish time. Inserting _aarch64
          # before ".AppImage" renames installer, tar.gz, and .sig
          # consistently, so signatures keep pairing with their artifacts.
          for f in "$BUNDLE_DIR"/appimage/*.AppImage "$BUNDLE_DIR"/appimage/*.AppImage.tar.gz "$BUNDLE_DIR"/appimage/*.sig; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            [[ "$base" == *aarch64* ]] || base="${base/.AppImage/_aarch64.AppImage}"
            cp "$f" "linux-arm64-staging/$base"
          done
          # .deb
          for f in "$BUNDLE_DIR"/deb/*.deb; do
            [ -f "$f" ] && cp "$f" linux-arm64-staging/
          done

      - name: Upload Linux ARM64 release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-arm64-release-assets
          path: linux-arm64-staging/

  # Smoke each architecture on its OWN hardware before anything is pushed
  # (B6-2). Emulating arm64 under QEMU would prove only that binfmt can
  # interpret the image — not that it runs on an ARM host — and it would make
  # the drain budget meaningless. Same runner pair as the release-server matrix.
  smoke-server-docker:
    name: Smoke Server Docker Image (linux/${{ matrix.arch }})
    needs: verify-versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    # Matrix job outputs are last-writer-wins and `outputs:` keys cannot be
    # derived from `matrix.*`, so the keys are static and each leg below writes
    # only its own — a skipped step's output is empty, so exactly one leg
    # writes each key.
    outputs:
      imageid-amd64: ${{ steps.id-amd64.outputs.imageid }}
      imageid-arm64: ${{ steps.id-arm64.outputs.imageid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Same VERSION the push job builds with, so the layers this job smoked are
      # the layers the push job restores from cache rather than rebuilding.
      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The commit time, not the wall clock. With it BuildKit stamps the same
      # `created` on the image config here and in release-server-docker, which
      # is what makes the two config digests comparable at push time.
      - name: Pin the image build timestamp to the commit
        id: epoch
        shell: bash
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      # Built locally and loaded, never pushed: a pushed :latest that dies on
      # boot deploys itself to every `docker compose pull` upgrade.
      #
      # Per-architecture cache scope: both legs run concurrently, and a shared
      # scope would have them overwrite each other's manifest.
      - name: Build image (local, for smoke test)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        with:
          context: Server/
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: VERSION=${{ env.VERSION }}
          tags: owncord-smoke:candidate
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      # Shared with ci.yml and nightly-docker-smoke.yml so the smoke itself is
      # exercised pre-merge — the first alpha.3 release run died here on a
      # smoke-harness bug (bare `docker run`, nowhere writable for the default
      # config) that no pre-merge check had ever run.
      - name: Lifecycle-smoke Docker image
        run: bash Server/scripts/docker-smoke.sh owncord-smoke:candidate

      # The config digest of the image this leg just smoked, read only after the
      # smoke passed. release-server-docker compares it against the digest it
      # pushed, so "the image the owner pulls" is provably the one that booted
      # on native hardware.
      - id: id-amd64
        if: matrix.arch == 'amd64'
        env:
          # Via env, not inline in the run script: zizmor's template-injection
          # audit is right that a `steps.*.outputs.*` expansion inside `run:` is
          # attacker-influenced text.
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: echo "imageid=${IMAGEID}" >> "$GITHUB_OUTPUT"

      - id: id-arm64
        if: matrix.arch == 'arm64'
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: echo "imageid=${IMAGEID}" >> "$GITHUB_OUTPUT"

  # B6-8. An upgrade is the path every existing install takes to this release,
  # and a failed one is the path back out — neither is exercised by any job
  # above, which all start from an empty directory or an empty volume. This
  # drives the PREVIOUS release through an upgrade to the tag being built and
  # back, in both deployment shapes, before anything is pushed or published. Same
  # placement as smoke-server-docker, and the same reason: a release that
  # cannot be upgraded into, or rolled back out of, must not ship.
  #
  # No `from-tag`: the rehearsal resolves the newest published release itself,
  # and at this point in the run that is the previous one — the publish job has
  # not created this tag's release yet.
  #
  # It upgrades TO a plain source build of this tag, not to the signed asset
  # release-server produces, so what it proves is that the TREE upgrades
  # cleanly. The gap is the ldflags stamp alone, and release-server already
  # runs the exact shipped binary through the full lifecycle smoke.
  #
  # A `uses:` job takes no timeout-minutes (GitHub rejects the key on a
  # reusable-workflow call); the timeout lives on the called workflow's job.
  upgrade-rehearsal:
    name: Rehearse Upgrade and Rollback # zizmor: ignore[self-repository] actionlint 1.7.7 rejects the $/ form
    needs: verify-versions
    # zizmor's self-repository audit prefers GitHub's `$/...` form here, and it
    # is right that the form is safer. The actionlint this repository pins
    # (1.7.7) rejects `$/...` as malformed, so adopting it would trade one gate
    # for another. The ignore above is deliberate and is re-examined when
    # actionlint learns the syntax.
    uses: ./.github/workflows/upgrade-rehearsal.yml
    permissions:
      contents: read

  release-server-docker:
    name: Build & Push Server Docker Image
    # Nothing reaches ghcr.io until BOTH architectures have been smoked on
    # native hardware and the upgrade+rollback rehearsal has passed. `publish`
    # needs this job, so that edge gates the GitHub Release too.
    needs: [smoke-server-docker, upgrade-rehearsal]
    # The `release` environment carries a required reviewer; naming it here
    # is what gates this job's ghcr.io push behind that approval, the same
    # way it gates the `publish` job below — without this line the push to
    # :latest goes out on every tag with no human in the loop.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sigstore signing. `id-token` mints the OIDC token the attestation is
      # bound to and `attestations` writes the record; actions/attest-build-
      # provenance needs both.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/owncord-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # `subject-name` must be lower-case for GHCR, and github.repository_owner
      # is `J3vb`. The same normalisation docker-compose.yml already bakes in
      # as ghcr.io/j3vb/owncord-server.
      - name: Lower-case the image owner (GHCR rejects `J3vb`)
        id: owner
        shell: bash
        run: echo "lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # One manifest carrying both architectures (B6-2). The smoke jobs this
      # job `needs` already ran each of these on its own hardware; the layers
      # come back from their per-architecture caches rather than being rebuilt.
      #
      # The Dockerfile cross-compiles from $BUILDPLATFORM, so the arm64 leg
      # costs a Go cross-compile here, not a QEMU-emulated toolchain.
      # Same commit time the smoke jobs used, so the per-platform image configs
      # this job pushes are byte-identical to the ones they smoked.
      - name: Pin the image build timestamp to the commit
        id: epoch
        shell: bash
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest (no release tags)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        with:
          context: Server/
          platforms: linux/amd64,linux/arm64
          push: true
          # SPDX SBOM and a max-mode provenance document, attached to the index
          # as extra manifests. Set here and not on the smoke builds above:
          # attestations require the OCI exporter, and those use the docker
          # exporter (`load: true`).
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ env.VERSION }}
          # Upload an untagged candidate. A cache miss or failed verification
          # must leave EVERY release tag where it was (OC-0448).
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.lower }}/owncord-server,push-by-digest=true,name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=server-amd64
            type=gha,scope=server-arm64
          cache-to: type=gha,mode=max,scope=server-manifest

      # Inspect the immutable candidate, never a mutable release tag. These
      # checks must all pass before the final promotion can move any tag.
      - name: Verify the pushed manifest carries both architectures
        id: verify-manifest
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lower }}/owncord-server
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "$IMAGE@$DIGEST")
          echo "$manifest"
          for arch in amd64 arm64; do
            case "$manifest" in
              *"linux/$arch"*) ;;
              *)
                echo "::error::pushed manifest $IMAGE@$DIGEST is missing linux/$arch"
                exit 1
                ;;
            esac
          done

      # The digest an owner pulls has to be the one that booted on native
      # hardware, and this is the only step that can say so.
      #
      # Config digests, never index digests: `sbom`/`provenance` above add
      # attestation manifests to the index, so the index digest necessarily
      # differs from anything a smoke job could have produced, while each
      # platform's own image config is unaffected by them.
      #
      # Equality here is a property of the CACHE, not of a bit-for-bit rebuild,
      # and that is worth knowing before reading a red run. Measured locally
      # with `--no-cache`: two clean builds of this same source at the same
      # SOURCE_DATE_EPOCH get DIFFERENT config digests, because the layer tar
      # carries the mtime `go build` stamped on /chatserver. The binary itself
      # is not the variable — `sha256sum /chatserver` inside the builder stage
      # matched across two no-cache builds. This job passes because the smoke
      # legs prime exactly the scopes read below, so the push reuses those
      # layers verbatim; a mismatch therefore means the cache missed (evicted,
      # or a scope renamed) and the candidate was rebuilt. It stays untagged:
      # none of the release tags move unless this equality check passes.
      #
      # `jq` is preinstalled on ubuntu-latest and already relied on by `publish`.
      - name: Prove the smoked image configs are the pushed image configs
        id: verify-configs
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lower }}/owncord-server
          DIGEST: ${{ steps.build.outputs.digest }}
          SMOKED_AMD64: ${{ needs.smoke-server-docker.outputs.imageid-amd64 }}
          SMOKED_ARM64: ${{ needs.smoke-server-docker.outputs.imageid-arm64 }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            if [ "$arch" = "amd64" ]; then smoked="$SMOKED_AMD64"; else smoked="$SMOKED_ARM64"; fi
            if [ -z "$smoked" ]; then
              echo "::error::smoke-server-docker reported no image config for linux/$arch"
              exit 1
            fi
            platform_digest=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{range .Manifest.Manifests}}{{if and (eq .Platform.OS \"linux\") (eq .Platform.Architecture \"$arch\")}}{{.Digest}}{{end}}{{end}}")
            if [ -z "$platform_digest" ]; then
              echo "::error::pushed manifest $IMAGE@$DIGEST carries no linux/$arch image"
              exit 1
            fi
            pushed=$(docker buildx imagetools inspect "$IMAGE@$platform_digest" --raw | jq -r '.config.digest')
            if [ "$smoked" != "$pushed" ]; then
              echo "::error::linux/$arch was smoked as image config $smoked but pushed as $pushed — check whether the gha cache scope server-$arch was hit before suspecting a genuinely different image (see the comment above this step)"
              exit 1
            fi
            echo "linux/$arch: smoked == pushed ($pushed)"
          done

      # Records the image in the public Sigstore log, and pushes the
      # attestation into the registry beside it, so a third party can verify
      # the digest they pull was built by this workflow at this commit.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.lower }}/owncord-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the image attestation
        id: verify-attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_OWNER_OUTPUTS_LOWER: ${{ steps.owner.outputs.lower }}
          STEPS_BUILD_OUTPUTS_DIGEST: ${{ steps.build.outputs.digest }}
        run: gh attestation verify "oci://ghcr.io/${STEPS_OWNER_OUTPUTS_LOWER}/owncord-server@${STEPS_BUILD_OUTPUTS_DIGEST}" --repo "$GITHUB_REPOSITORY"

      # Sole release-tag write, after every verification above. A single index
      # source makes imagetools create copy that index verbatim, including its
      # SBOM/provenance manifests; do not rebuild or assemble platform digests
      # here. The verified digest is also the promotion source, never a tag.
      # Registry writes across tags are not transactional: a transport failure
      # during promotion can be partial, but a verification failure reaches no
      # tag write at all. Leave this as the final, success-only step.
      - name: Promote verified digest to release tags
        id: promote-tags
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lower }}/owncord-server
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::metadata-action reported no release tags"
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"

  publish:
    name: Publish GitHub Release
    needs:
      [
        release-client-windows,
        release-client-linux,
        release-client-linux-arm64,
        release-server,
        release-server-docker,
      ]
    runs-on: ubuntu-latest
    # The `release` environment carries a required reviewer; naming it here
    # is what makes that approval gate fire before anything is signed or
    # published. Without this line the environment exists but never applies.
    environment: release
    permissions:
      contents: write
      # Sigstore signing, as in release-server-docker: `id-token` for the OIDC
      # token, `attestations` to write the record.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          # zizmor cache-poisoning. This workflow publishes runtime artifacts and
          # is tag-triggered, so it must not restore a cache an attacker could
          # poison. Removing `cache: npm` is what stops the restore on today's
          # v4 pin; `package-manager-cache: false` is zizmor's documented input
          # and becomes load-bearing if setup-node is ever bumped to v5, where
          # caching is on by default.
          package-manager-cache: false

      - name: Download Windows client assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release-assets
          path: windows

      - name: Download Linux x86_64 client assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-assets
          path: linux

      - name: Download Linux ARM64 client assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-arm64-release-assets
          path: linux

      # Four server assets, one per supported architecture. They land in the
      # same windows/ and linux/ staging directories the client assets use, so
      # the checksum and release steps below pick them all up unchanged.
      - name: Download Windows server binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-windows-*
          merge-multiple: true
          path: windows

      - name: Download Linux server archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-linux-*
          merge-multiple: true
          path: linux

      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create source snapshot (AGPL source availability)
        shell: bash
        run: |
          git archive --format=tar.gz --prefix="OwnCord-${VERSION}/" \
            -o "owncord-src-${GITHUB_REF_NAME}.tar.gz" HEAD

      # Checksum lines must use bare asset filenames: the v1.0.0 updater's
      # ParseChecksumFile does an exact match on the last field, so a
      # "windows/" prefix would strand every deployed server on 1.0.0.
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          (cd windows && sha256sum -- *) > checksums.sha256
          (cd linux && sha256sum -- *) >> checksums.sha256
          sha256sum owncord-src-*.tar.gz >> checksums.sha256

      # Server-side schema: updater.releaseManifest.
      - name: Generate server update manifest
        shell: bash
        run: |
          # Built from the files on disk, not a hard-coded list: an asset
          # added to the build matrix and forgotten here would be published
          # without a signed hash, and every host on that architecture would
          # refuse the update with no obvious cause.
          set -euo pipefail
          WIN_HASH=$(sha256sum windows/chatserver.exe | awk '{print $1}')
          # protocol_epoch is read from the schema, never typed here, so the
          # manifest cannot drift from the constants the binaries were built with.
          # The server's client-update endpoint withholds any release whose epoch
          # is newer than its own (Server/api/client_update.go).
          EPOCH=$(jq -e '.protocol_epoch' protocol/schema.json)
          ASSETS=$(
            for f in windows/chatserver*.exe linux/chatserver-linux-*.tar.gz; do
              jq -n -c --arg a "$(basename "$f")"                 --arg h "$(sha256sum "$f" | awk '{print $1}')"                 '{asset: $a, sha256: $h}'
            done | jq -s -c .
          )
          # The legacy top-level asset/sha256 pair stays bound to the Windows
          # amd64 binary so already-deployed servers, which only understand the
          # single-asset schema, can still verify and update.
          jq -n -c --arg v "v$VERSION" --arg h "$WIN_HASH"             --argjson assets "$ASSETS" --argjson epoch "$EPOCH"             '{version: $v, asset: "chatserver.exe", sha256: $h, assets: $assets, protocol_epoch: $epoch}'             > windows/server-update-manifest.json
          echo "manifest covers $(jq '.assets | length' windows/server-update-manifest.json) assets"

      - name: Sign server update assets
        working-directory: Client
        shell: bash
        env:
          SERVER_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.SERVER_UPDATE_SIGNING_PRIVATE_KEY }}
          SERVER_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SERVER_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          KEY_PATH=$(mktemp)
          printf '%s' "$SERVER_UPDATE_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT
          npm ci
          # Every Windows binary needs its own detached signature: the updater
          # pairs the signature with the asset it downloaded, so an arm64 host
          # offered the amd64 .sig would fail verification on every update
          # (Server/updater/download.go, serverSignatureAssetName).
          for f in ../windows/chatserver*.exe ../windows/server-update-manifest.json; do
            npx tauri signer sign -f "$KEY_PATH" -p "$SERVER_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD" "$f"
          done

      # Fail closed before publishing: prove the freshly signed assets verify
      # against the pinned public key that ships inside the server binary.
      # Catches key/pubkey mismatch, signature format drift, and signer flag
      # regressions — each of which has silently broken this pipeline before.
      - name: Verify signed assets against pinned server update key
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          base64 -d Server/updater/server_update_public_key.txt > "$RUNNER_TEMP/server_update.pub"
          for f in windows/chatserver*.exe windows/server-update-manifest.json; do
            base64 -d "$f.sig" > "$RUNNER_TEMP/asset.minisig"
            minisign -Vm "$f" -x "$RUNNER_TEMP/asset.minisig" -p "$RUNNER_TEMP/server_update.pub"
          done

      # Subjects are globs over the staging directories rather than an
      # enumerated list, for the same reason the update manifest is built from
      # the files on disk: an asset added to the build matrix must not become
      # publishable unattested. The globs deliberately include the `.sig` files
      # and the update manifest, which binds the minisign signatures themselves
      # to this run. The attestation names the workflow and run, not the job —
      # accurate at the run level, which is what SLSA's GitHub build type
      # records, and what makes this Build L2 rather than L3.
      - name: Attest build provenance (every asset, the checksums, the source snapshot)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            windows/*
            linux/*
            checksums.sha256
            owncord-src-*.tar.gz

      # Server assets only — roadmap workstream 6 hands the signed Tauri client
      # bundles to B8, and a Rust+npm SBOM is a different tool. The action takes
      # a single `sbom-path`, so this is one step per asset/SBOM pair rather
      # than one globbed pair.
      - name: Attest SBOM (chatserver.exe)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: windows/chatserver.exe
          sbom-path: windows/chatserver.exe.cdx.json

      - name: Attest SBOM (chatserver-windows-arm64.exe)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: windows/chatserver-windows-arm64.exe
          sbom-path: windows/chatserver-windows-arm64.exe.cdx.json

      - name: Attest SBOM (chatserver-linux-amd64.tar.gz)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: linux/chatserver-linux-amd64.tar.gz
          sbom-path: linux/chatserver-linux-amd64.tar.gz.cdx.json

      - name: Attest SBOM (chatserver-linux-arm64.tar.gz)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: linux/chatserver-linux-arm64.tar.gz
          sbom-path: linux/chatserver-linux-arm64.tar.gz.cdx.json

      # Fail closed before publishing: an attestation that does not verify is
      # worse than none, because the docs tell an owner to check it.
      - name: Verify attestations against this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in windows/* linux/* checksums.sha256 owncord-src-*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done

      # The release body is the curated section for THIS tag, never the whole
      # file. v1.2.0-alpha.4 published all 795 lines of CHANGELOG.md — every
      # past release, plus the "How to write an entry" style guide aimed at
      # contributors — because `--notes-file CHANGELOG.md` hands GitHub the
      # entire file and nothing ever narrowed it.
      #
      # The `changelogen --output CHANGELOG.md` step that used to run here is
      # gone. It ran after the tag existed, so its from-tag and to-tag were the
      # same commit: it appended an empty `## <tag>...<tag>` heading whose
      # compare link pointed at itself, and no step consumed the result.
      # `npm run changelog` still exists for drafting an entry locally, which
      # is the point in time where generating one is useful.
      #
      # Fail closed. Empty notes on a public download page are worse than a
      # failed run: the run can be re-run once the entry is written, but a
      # published release with no description has already been fetched.
      - name: Extract this tag's release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DOC_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}
        run: |
          # Headings carry an optional title ("## v1.2.0-alpha.1 — Discord
          # feature parity"), so match the tag as a whole word, not a prefix:
          # a bare prefix match would let `v1.2.0` swallow `v1.2.0-alpha.4`.
          awk -v tag="$TAG" '
            $0 == "## " tag || index($0, "## " tag " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $TAG' section. Write the entry, then re-run this release."
            exit 1
          fi

          # Relative links resolve against the repository, not against a
          # release page, so every one of them 404s for a release reader.
          sed -i "s#](docs/#]($DOC_BASE/docs/#g" release-notes.md
          echo "Release notes: $(wc -l < release-notes.md) lines, $(wc -c < release-notes.md) bytes"

      # Sole publish target. This repo is public, so its own Releases page both
      # satisfies AGPL source availability (via the owncord-src snapshot below)
      # and serves as the publicly-readable feed that deployed servers and
      # clients poll for updates. The former mirror step to a separate public
      # releases repo existed only to work around this repo being private.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(find windows linux -type f)
          assets+=(checksums.sha256 owncord-src-*.tar.gz)
          gh release create "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${assets[@]}"
