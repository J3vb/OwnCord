# Prometheus scrape config for local development. Two jobs:
#   owncord         the OTel exporter at /metrics (needs -tags otel and
#                   telemetry.exporter: prometheus).
#   owncord-builtin the built-in exposition at /api/v1/metrics/prometheus, in
#                   every build. It is limited to server.metrics_allowed_cidrs
#                   (falling back to admin_allowed_cidrs), so a scraper outside
#                   a private network needs that key set.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: owncord
    static_configs:
      - targets: ["host.docker.internal:8443"]
    scheme: https
    tls_config:
      insecure_skip_verify: true # dev-only; real certs in staging/prod

  - job_name: owncord-builtin
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:8443"]
    scheme: https
    tls_config:
      insecure_skip_verify: true # dev-only; real certs in staging/prod
