version: "2"
sql:
  # ── SQLite backend ────────────────────────────────────────────────────────
  - engine: "sqlite"
    queries: "db/queries/sqlite"
    schema: "migrations"
    gen:
      go:
        package: "dbgen"
        out: "db/dbgen"
        sql_package: "database/sql"
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_json_tags: true
        json_tags_case_style: "camel"
