# OwnCord server stack — chat server + LiveKit voice/video
#
# Quick start:
#   1. cp .env.example .env  && edit .env (set secrets)
#   2. cp livekit.yaml.example livekit.yaml  && edit livekit.yaml (same keys)
#   3. cp config.yaml.example config.yaml  && edit as needed
#   4. docker compose up -d
#
# LiveKit runs as a separate container on the same internal network.
# The OwnCord server reaches it at ws://livekit:7880 (Docker DNS), and it
# proxies signalling to clients at :8443/livekit — so 7880 need not be
# published or forwarded. Firewall TCP 7881 and UDP 50000-60000 for media
# (or a single UDP port — see the livekit service's ports below).
#
# The environment block below already points the server at that service and
# keeps its own auto-download off (LiveKit is its own container here), so
# config.yaml needs no voice.livekit_url or voice.auto_download_livekit edit.

# Log rotation shared by both services: without a cap the default json-file
# driver grows unbounded on the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  owncord:
    image: ghcr.io/j3vb/owncord-server:latest
    restart: unless-stopped
    # The server's HTTP drain takes up to 30s and its whole teardown is capped
    # at 50s; Compose's default 10s would SIGKILL an ordinary
    # `docker compose down` mid-flush.
    stop_grace_period: 60s
    ports:
      - "8443:8443"
    environment:
      # Secrets injected from .env — never hardcode these
      OWNCORD_VOICE_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      OWNCORD_VOICE_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Voice wiring for this stack: reach LiveKit by its compose service name
      # and leave the server's own auto-download off, so it never starts a
      # second LiveKit inside this container on media ports nothing publishes.
      # Set here rather than in config.yaml so the operator's mounted config
      # stays free of Docker-specific values.
      OWNCORD_VOICE_LIVEKIT_URL: ws://livekit:7880
      OWNCORD_VOICE_AUTO_DOWNLOAD_LIVEKIT: "false"
      # Single-port UDP media: match livekit.yaml's `rtc.udp_port` so the
      # admin connectivity report and boot warning name that one port.
      # OWNCORD_VOICE_UDP_PORT: "7882"
    volumes:
      # Mount your config.yaml for non-secret settings (server name, TLS, etc.)
      # See the example config at: https://github.com/J3vb/OwnCord#configuration
      - ./config.yaml:/app/config.yaml:ro
      # Persistent data (SQLite DB + uploaded files)
      - owncord-data:/app/data
    # No `healthcheck:` here on purpose. The image declares its own (see
    # Server/Dockerfile) and compose inherits it, so the probe cannot drift
    # between "run the image" and "run the compose file". The binary is its own
    # probe — the distroless image has no shell or curl. Plain docker compose
    # only SURFACES unhealthy (docker ps, events); pair with an external
    # watchdog (or an autoheal container) if you want automatic restarts on hang.
    #
    # Open-file limit. Each WebSocket holds a descriptor. The Go runtime already
    # lifts the SOFT limit to just under the HARD one at init, and the server
    # raises it the rest of the way, so the hard limit here is the real
    # ceiling. Without this, the hard limit is whatever the host daemon passes
    # down, and an old or tuned-down daemon can pass 1,024, which a few hundred
    # online will reach. Pinning it makes the ceiling explicit. 65,536 carries
    # about 2,000 connections with headroom; for a larger server raise it to a
    # bigger number (up to the host's fs.nr_open, usually 1048576). Not -1: the
    # kernel refuses an unlimited nofile limit and the container fails to start.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Minimal privilege. The image already runs as uid 65532 on distroless (no
    # shell, no package manager); these two drop what is left. The server binds
    # 8443, above the privileged-port range, so it needs no capability at all.
    # `read_only: true` is deliberately NOT set: the server writes its default
    # config.yaml into /app on first boot, and a read-only root filesystem turns
    # that documented behaviour into a boot failure for anyone who has not yet
    # mounted a config.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # Uncomment and size to your host to keep a runaway process from starving
    # the machine (values are a starting point for a small community):
    # mem_limit: 1g
    # cpus: "2.0"
    depends_on:
      - livekit
    networks:
      - owncord-net

  livekit:
    # Must move together with DefaultLiveKitVersion in Server/ws/livekit_download.go:
    # this file is what an operator runs without the server's own pin, so a
    # version skew here is invisible until voice fails.
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    # LiveKit config file — copy livekit.yaml.example → livekit.yaml and fill in
    command: --config /etc/livekit/livekit.yaml
    ports:
      # 7880 is LiveKit's own API/signalling endpoint and is deliberately NOT
      # published: clients tunnel signalling through the OwnCord server's
      # /livekit proxy on :8443. Publishing it would expose LiveKit's API to
      # the host network for no benefit — and would let anyone who knows the
      # credentials in your .env mint room tokens directly.
      - "7881:7881" # TCP fallback for WebRTC (clients behind strict NAT)
      # WebRTC UDP media. The default is the 50000-60000 range; to forward a
      # single port instead, set `rtc.udp_port: 7882` in livekit.yaml,
      # replace the range below with `- "7882:7882/udp"`, and uncomment
      # OWNCORD_VOICE_UDP_PORT on the owncord service above.
      - "50000-60000:50000-60000/udp" # WebRTC UDP media streams
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    logging: *default-logging
    networks:
      - owncord-net

networks:
  owncord-net:
    driver: bridge

volumes:
  owncord-data:
