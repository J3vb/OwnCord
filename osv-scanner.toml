# Baseline for the CI supply-chain scan (ci.yml, Supply-chain Scan job):
#
#   osv-scanner scan source --config osv-scanner.toml \
#     -L Server/go.mod -L Client/package-lock.json \
#     -L Client/src-tauri/Cargo.lock -L tools/mcp-introspect/package-lock.json \
#     -L package-lock.json
#
# Each entry is a finding that is present at HEAD and reviewed as accepted, so
# the scan fails on anything NEW. A new advisory, or a fixed version reaching an
# ignored package, is not silent: `IgnoreVulns` matches the advisory ID, not the
# package/version, and an entry that no longer matches anything is reported as
# an unused ignore. Remove an entry when its dependency moves to the fixed
# version named in the reason.

