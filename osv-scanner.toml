# Baseline for the CI supply-chain scan (ci.yml, Supply-chain Scan job):
#
#   osv-scanner scan source --config osv-scanner.toml \
#     -L Server/go.mod -L Client/package-lock.json \
#     -L Client/src-tauri/Cargo.lock -L tools/mcp-introspect/package-lock.json \
#     -L package-lock.json
#
# Each entry is a finding that is present at HEAD and reviewed as accepted, so
# the scan fails on anything NEW. `IgnoredVulns` matches the advisory ID, not the
# package/version, and osv-scanner does NOT report an entry that no longer
# matches anything: a stale ignore here stays silent. Remove an entry when its
# dependency moves to the fixed version named in the reason, and re-check the
# list whenever a lockfile moves (cargo-deny, below, does fail on its own stale
# Rust ignores).

# --- Go: reached through the module graph, not called. govulncheck (a
# separate, call-aware gate in Server Build & Test) is the authority here and
# reports 0 reachable vulnerabilities; this one is module-level only.
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto, module-level only: govulncheck reports it unreachable from our code"

