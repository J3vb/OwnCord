# block-buffer 0.10.4 comes in through digest 0.10 (sha2 for tauri-codegen, wry
# and the secret-service crates; sha1 for tungstenite and zbus 4; md-5; hkdf).
# Moving to the fixed 0.12.1 needs the digest 0.11 stack in every one of those,
# so it is not a lockfile bump. The advisory needs a panic inside a hashing
# callback that the caller catches and then keeps using the same buffer; none of
# these callers catch panics around a hash. Drop it once digest 0.10 leaves the
# graph (0.12.1 is already here via digest 0.11).
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer 0.10 via digest 0.10: fix needs the digest 0.11 stack upstream; needs a caught panic plus buffer reuse, which no caller does"

